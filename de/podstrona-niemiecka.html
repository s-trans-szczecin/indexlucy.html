<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Gravity Lens</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
color:#f4f4f4;
height:100vh;
overflow:hidden;
}

/* ================= SCENE ================= */

.scene{
position:fixed;
inset:0;
z-index:-2;
overflow:hidden;
}

/* ================= GALAXY ================= */

.left,.right{
position:absolute;
top:50%;
left:50%;
width:200vw;
height:200vh;
transform:translate(-50%,-50%);
background-size:contain;
background-repeat:no-repeat;
background-position:center;
filter:blur(1px) saturate(1.4);
}

/* LEFT TEARING */
.left{
background-image:url("/indexlucy.html/public/images/galaxy-left.png");
animation:tearLeft 6s ease-in-out infinite;
}

/* RIGHT TEARING */
.right{
background-image:url("/indexlucy.html/public/images/galaxy-right.png");
animation:tearRight 6s ease-in-out infinite;
}

/* ================= TEARING EFFECT ================= */

@keyframes tearLeft{
0%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}
40%{transform:translate(-60%,-55%) rotate(-8deg) scale(1.05)}
70%{transform:translate(-45%,-50%) scale(0.95)}
100%{transform:translate(-50%,-50%) scale(1)}
}

@keyframes tearRight{
0%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}
40%{transform:translate(-40%,-45%) rotate(8deg) scale(1.05)}
70%{transform:translate(-55%,-50%) scale(0.95)}
100%{transform:translate(-50%,-50%) scale(1)}
}

/* ================= CORE ================= */

.core{
position:absolute;
top:50%;
left:50%;
width:300px;
height:300px;
transform:translate(-50%,-50%);
background:url("/indexlucy.html/public/images/galaxy-core.png") center/contain no-repeat;
filter:drop-shadow(0 0 80px rgba(0,0,0,.95));
animation:coreSpin 18s linear infinite, corePulse 5s ease-in-out infinite;
}

/* wolniejszy spin + ciężar */
@keyframes coreSpin{
0%{transform:translate(-50%,-50%) rotate(0deg)}
100%{transform:translate(-50%,-50%) rotate(360deg)}
}

@keyframes corePulse{
0%,100%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.15)}
}

/* ================= LENS DISTORTION ================= */

.lens{
position:absolute;
top:50%;
left:50%;
width:500px;
height:500px;
transform:translate(-50%,-50%);
border-radius:50%;
background:radial-gradient(circle,
rgba(255,255,255,.08),
rgba(0,0,0,.2),
rgba(0,0,0,.9)
);

filter:blur(10px);
mix-blend-mode:screen;
animation:lensWarp 6s ease-in-out infinite;
}

@keyframes lensWarp{
0%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.25) skewX(2deg)}
100%{transform:translate(-50%,-50%) scale(1)}
}

/* ================= FLASH ================= */

.flash{
position:absolute;
top:50%;
left:50%;
width:160px;
height:160px;
transform:translate(-50%,-50%);
border-radius:50%;
background:white;
opacity:0;
filter:blur(40px);
mix-blend-mode:screen;
animation:flash 6s ease-in-out infinite;
}

@keyframes flash{
0%,85%,100%{opacity:0}
88%{opacity:1}
92%{opacity:.2}
}

/* ================= DARK ================= */

.dark{
position:fixed;
inset:0;
background:radial-gradient(circle,rgba(0,0,0,.1),rgba(0,0,0,.95));
z-index:-3;
}

/* ================= LOGO ================= */

.logo{
position:fixed;
top:14px;
left:14px;
width:100px;
z-index:1000;
}
.logo img{
width:100%;
animation:spin 8s linear infinite;
}
@keyframes spin{
0%{transform:rotateY(0)}
100%{transform:rotateY(360deg)}
}

/* ================= HERO ================= */

.hero{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

h1{
font-family:'Playfair Display';
font-size:clamp(3rem,6vw,4rem);
}

h1 span{
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* ================= MENU (POD NAPISEM) ================= */

.nav{
margin-top:25px;
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
z-index:2;
}

.nav a{
padding:10px 16px;
border-radius:30px;
border:1px solid rgba(212,175,55,.5);
color:#f5e6b8;
text-decoration:none;
background:rgba(0,0,0,.3);
backdrop-filter:blur(8px);
font-size:.85rem;
}

.nav a:hover{
background:rgba(212,175,55,.2);
}

</style>
</head>

<body>

<div class="scene">
  <div class="left"></div>
  <div class="right"></div>
  <div class="lens"></div>
  <div class="core"></div>
  <div class="flash"></div>
</div>

<div class="dark"></div>

<div class="logo">
<img src="/images/logoLEC.png">
</div>

<div class="hero">
<h1><span>Lucy</span>EpoxyStudio</h1>

<a href="../en/index.html">EN</a>

<a href="kontakt.html">Contact</a>
</div>

</div>

</body>
</html>
