<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Epoxidharz Möbel Deutschland</title>
<meta name="description" content="LucyEpoxyStudio - Premium Epoxidharz Möbel.">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
color:#f4f4f4;
line-height:1.7;
overflow-x:hidden;
position:relative;
}

/* ===== HOLOGRAPHIC EPoxy GALAXY ===== */
.hero-bg{
position:fixed;
inset:-30%;
z-index:-2;
background:
radial-gradient(circle at 20% 30%, rgba(212,175,55,.25), transparent 40%),
radial-gradient(circle at 70% 60%, rgba(255,255,255,.08), transparent 45%),
radial-gradient(circle at 40% 80%, rgba(160,120,255,.15), transparent 50%),
radial-gradient(circle at 60% 20%, rgba(0,200,255,.10), transparent 55%),
linear-gradient(120deg, #050505, #0a0a0a);
filter:blur(1px) contrast(1.2);
animation:epoxyFlow 18s ease-in-out infinite;
}

@keyframes epoxyFlow{
0%{
transform:scale(1.2) translateX(-2%) translateY(-1%);
filter:hue-rotate(0deg);
}
50%{
transform:scale(1.3) translateX(3%) translateY(2%);
filter:hue-rotate(20deg);
}
100%{
transform:scale(1.2) translateX(-2%) translateY(-1%);
filter:hue-rotate(0deg);
}
}

/* overlay for readability */
.hero-overlay{
position:fixed;
inset:0;
z-index:-1;
background:radial-gradient(ellipse at center,
rgba(0,0,0,.2) 0%,
rgba(0,0,0,.55) 60%,
rgba(0,0,0,.85) 100%);
}

/* subtle grid */
body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
z-index:0;
background:
repeating-linear-gradient(90deg, rgba(212,175,55,.06) 0 2px, transparent 2px 30px),
repeating-linear-gradient(0deg, rgba(212,175,55,.04) 0 2px, transparent 2px 30px);
opacity:.25;
}

/* ===== HEADER ===== */
header{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:2rem;
position:relative;
}

header::before{
content:"";
position:absolute;
inset:0;
background:radial-gradient(circle at top,
rgba(255,255,255,.1),
rgba(212,175,55,.25),
rgba(0,0,0,.7));
z-index:-1;
}

h1{
font-family:'Playfair Display',serif;
font-size:clamp(3rem,6vw,4.5rem);
}

h1 span{
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero-text{
max-width:760px;
margin-top:1.2rem;
font-size:1.2rem;
color:#e0e0e0;
}

.nav-buttons{
margin-top:2rem;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:.8rem;
}

.cta{
display:inline-block;
padding:1rem 1.7rem;
border-radius:50px;
border:1px solid rgba(212,175,55,.6);
background:rgba(255,255,255,.06);
color:#f5e6b8;
text-decoration:none;
transition:.4s;
}

.cta:hover{
background:rgba(212,175,55,.25);
transform:translateY(-4px);
box-shadow:0 25px 50px rgba(212,175,55,.4);
}

/* ===== LOGO ===== */
.corner-logo{
position:fixed;
top:14px;
left:14px;
z-index:10001;
width:min(18vw,130px);
min-width:84px;
animation:logoSpin 8s linear infinite;
transform-origin:center center;
}

.corner-logo img{
display:block;
width:100%;
height:auto;
filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));
border-radius:12px;
}

@keyframes logoSpin{
0%{transform:rotateY(0deg)}
100%{transform:rotateY(360deg)}
}

/* ===== MOBILE FIX ===== */
@media(max-width:768px){

.corner-logo{
top:10px;
left:10px;
width:70px;
min-width:70px;
}

header{
padding-top:90px;
}

h1{
font-size:clamp(2rem,8vw,3rem);
line-height:1.1;
word-break:break-word;
display:flex;
flex-direction:column;
}

.hero-text{
padding:0 10px;
}
}
</style>
</head>

<body>

<div class="hero-bg"></div>
<div class="hero-overlay"></div>

<div class="corner-logo">
<img src="/images/logoLEC.png"
alt="Lucy Epoxy Studio logo"
onerror="if(!this.dataset.step){this.dataset.step='1';this.src='images/logoLEC.png';}
else if(this.dataset.step==='1'){this.dataset.step='2';this.src='public/images/logoLEC.png';}
else if(this.dataset.step==='2'){this.dataset.step='3';this.src='/images/logoLEC.png';}
else if(this.dataset.step==='3'){this.dataset.step='4';this.src='logoLEC.png';}
else if(this.dataset.step==='4'){this.dataset.step='5';this.src='/logoLEC.png';}
else if(this.dataset.step==='5'){this.dataset.step='6';this.src='images/logoLEC.PNG';}
else{this.onerror=null;this.src='/favicon.svg';}">
</div>

<header>
<h1><span>Lucy</span>EpoxyStudio</h1>

<p class="hero-text">
Exklusive Epoxidharz-Möbel und handgefertigte Premium-Designs für den deutschen Markt.
</p>

<div class="nav-buttons">
<a class="cta" href="../index.html">Polska</a>
<a class="cta" href="../en/index.html">English</a>
<a class="cta" href="premium-projekt.html">Premium Projekt</a>
<a class="cta" href="kontakt.html">Kontakt</a>
<a class="cta" href="android-app.html">Android App</a>
<a class="cta" href="realisierungen.html">Realisierungen</a>
</div>

</header>

</body>
</html>
