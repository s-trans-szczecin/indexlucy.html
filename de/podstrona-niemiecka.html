<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Cosmic Luxury</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
overflow:hidden;
height:100vh;
color:#f4f4f4;
}

/* ================= GALAXY ================= */

.scene{
position:fixed;
inset:0;
z-index:-2;
}

.left,.right{
position:absolute;
top:50%;
left:50%;
width:200vw;
height:200vh;
transform:translate(-50%,-50%);
background-size:contain;
background-repeat:no-repeat;
background-position:center;
filter:blur(1px) saturate(1.3);
}

.left{background-image:url("/indexlucy.html/public/images/galaxy-left.png");}
.right{background-image:url("/indexlucy.html/public/images/galaxy-right.png");}

.left{animation:driftL 20s ease-in-out infinite;}
.right{animation:driftR 24s ease-in-out infinite;}

@keyframes driftL{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-52%,-50%) rotate(-5deg)}
}

@keyframes driftR{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-48%,-50%) rotate(5deg)}
}

/* ================= CORE ================= */

.core{
position:absolute;
top:50%;
left:50%;
width:320px;
height:320px;
transform:translate(-50%,-50%);
background:url("/indexlucy.html/public/images/galaxy-core.png") center/contain no-repeat;
animation:
coreSpinLeft 14s linear infinite,
coreFlatten 6s ease-in-out infinite;
}

@keyframes coreSpinLeft{
0%{transform:translate(-50%,-50%) rotate(0deg)}
100%{transform:translate(-50%,-50%) rotate(-360deg)}
}

@keyframes coreFlatten{
0%,100%{transform:translate(-50%,-50%) scale(1,1)}
50%{transform:translate(-50%,-50%) scale(1.25,.75)}
}

/* ================= TEXT ================= */

.hero{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

h1{
font-family:'Playfair Display';
font-size:clamp(2.5rem,6vw,4rem);
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
color:transparent;
}

/* ================= MENU (RESTORED) ================= */

.nav{
margin-top:25px;
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
}

.nav a{
padding:10px 16px;
border-radius:30px;
border:1px solid rgba(212,175,55,.5);
color:#f5e6b8;
text-decoration:none;
background:rgba(0,0,0,.35);
backdrop-filter:blur(8px);
font-size:.85rem;
}

.nav a:hover{
background:rgba(212,175,55,.2);
}

/* ================= PARTICLES ================= */

.particle{
position:absolute;
font-family:'Playfair Display',serif;
font-size:2rem;
font-weight:700;
color:#d4af37;
pointer-events:none;
text-shadow:0 0 10px rgba(212,175,55,.8);
animation:fly 1.6s ease-out forwards;
}

@keyframes fly{
0%{transform:translate(0,0) scale(1);opacity:1}
100%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}
}

/* rebuild */
.particle.rebuild{
animation:rebuild 1.4s ease-in forwards !important;
}

@keyframes rebuild{
0%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}
100%{transform:translate(0,0) scale(1);opacity:1}
}

</style>
</head>

<body>

<div class="scene">
  <div class="left"></div>
  <div class="right"></div>
  <div class="core"></div>
</div>

<div class="hero">

<h1 id="brand">LucyEpoxyStudio</h1>

<div class="nav">
<a href="../index.html">PL</a>
<a href="../en/index.html">EN</a>
<a href="realisierungen.html">Projects</a>
<a href="kontakt.html">Contact</a>
<a href="android-app.html">App</a>
</div>

</div>

<script>
const text=document.getElementById("brand");

let spans=[];
let particles=[];

function explode(){

const letters=text.innerText.split("");
text.innerHTML="";

letters.forEach(c=>{
const s=document.createElement("span");
s.innerText=c;
text.appendChild(s);
});

requestAnimationFrame(()=>{

spans=text.querySelectorAll("span");

spans.forEach((span,i)=>{

const rect=span.getBoundingClientRect();

for(let j=0;j<2;j++){
const p=document.createElement("div");
p.className="particle";
p.innerText=span.innerText;

const angle=Math.random()*Math.PI*2;
const dist=50+Math.random()*120;

p.style.left=rect.left+"px";
p.style.top=rect.top+"px";
p.style.setProperty("--x",Math.cos(angle)*dist+"px");
p.style.setProperty("--y",Math.sin(angle)*dist-80+"px");

document.body.appendChild(p);
particles.push(p);
}

span.style.opacity="0";

});

setTimeout(rebuild,1800);

});

}

function rebuild(){

particles.forEach(p=>{
p.classList.add("rebuild");
setTimeout(()=>p.remove(),1400);
});

setTimeout(()=>{
text.innerHTML="LucyEpoxyStudio";
setTimeout(explode,2500);
},1500);

}

window.addEventListener("load",()=>{
setTimeout(explode,1200);
});
</script>

</body>
</html>
