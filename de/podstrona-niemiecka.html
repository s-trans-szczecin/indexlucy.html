<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
color:#f4f4f4;
overflow-x:hidden;
}

/* HEADER */
header{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:2rem;
}

/* TITLE */
h1{
font-family:'Playfair Display',serif;
font-size:clamp(3rem,6vw,4.5rem);
}

h1 span{
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero-text{
margin-top:1rem;
max-width:700px;
}

/* BUTTONS */
.nav-buttons{
margin-top:2rem;
display:flex;
gap:.8rem;
flex-wrap:wrap;
justify-content:center;
}

.cta{
padding:1rem 1.7rem;
border-radius:50px;
border:1px solid rgba(212,175,55,.6);
color:#f5e6b8;
text-decoration:none;
}

/* LOGO - STABLE */
.corner-logo{
position:fixed;
top:14px;
left:14px;
width:90px;
z-index:9999;
}

.corner-logo img{
width:100%;
border-radius:12px;
animation:rotateLogo 10s linear infinite;
}

@keyframes rotateLogo{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

/* MOBILE */
@media(max-width:768px){
.corner-logo{width:65px;top:10px;left:10px}
header{padding-top:90px}
h1{font-size:2rem}
}
</style>
</head>

<body>

<div class="corner-logo">
<img src="/images/logoLEC.png" alt="logo">
</div>

<header>
<h1><span>Lucy</span>EpoxyStudio</h1>

<p class="hero-text">
Exklusive Epoxidharz Möbel und Premium Design.
</p>

<div class="nav-buttons">
<a class="cta" href="../index.html">Polska</a>
<a class="cta" href="../en/index.html">English</a>
<a class="cta" href="premium-projekt.html">Premium</a>
<a class="cta" href="kontakt.html">Kontakt</a>
</div>

</header>

</body>
</html>
