<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Epoxidharz Möbel Deutschland</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
color:#f4f4f4;
overflow-x:hidden;
position:relative;
}

/* ================= GALAXY SYSTEM ================= */

.galaxy-wrap{
position:fixed;
inset:0;
z-index:-3;
pointer-events:none;
overflow:hidden;
}

/* LEFT */
.galaxy-left{
position:absolute;
top:50%;
left:50%;
width:160vw;
height:160vh;
background:url("/indexlucy.html/public/images/galaxy-left.png") center/contain no-repeat;
transform:translate(-50%,-50%);
filter:blur(1px) saturate(1.3);
animation:leftFlow 10s ease-in-out infinite;
}

/* RIGHT */
.galaxy-right{
position:absolute;
top:50%;
left:50%;
width:160vw;
height:160vh;
background:url("/indexlucy.html/public/images/galaxy-right.png") center/contain no-repeat;
transform:translate(-50%,-50%);
filter:blur(1px) saturate(1.3);
animation:rightFlow 10s ease-in-out infinite;
}

/* CORE */
.galaxy-core{
position:absolute;
top:50%;
left:50%;
width:260px;
height:260px;
background:url("/indexlucy.html/public/images/galaxy-core.png") center/contain no-repeat;
transform:translate(-50%,-50%);
filter:drop-shadow(0 0 40px rgba(0,0,0,.9));
animation:coreLife 8s ease-in-out infinite;
}

/* ================= ANIMATIONS ================= */

/* CORE: "życie + spłaszczenie + obrót" */
@keyframes coreLife{
0%{
transform:translate(-50%,-50%) scale(1,1) rotate(0deg);
}
25%{
transform:translate(-50%,-50%) scale(1.15,0.85) rotate(90deg);
}
50%{
transform:translate(-50%,-50%) scale(0.9,1.2) rotate(180deg);
}
75%{
transform:translate(-50%,-50%) scale(1.1,0.9) rotate(270deg);
}
100%{
transform:translate(-50%,-50%) scale(1,1) rotate(360deg);
}
}

/* LEFT: przechył → rozciągnięcie → zawijanie */
@keyframes leftFlow{
0%{
transform:translate(-50%,-50%) rotate(0deg) translate(0,0) scale(1);
}
20%{
transform:translate(-50%,-50%) rotate(8deg) translate(-20px,10px) scale(1.05);
}
45%{
transform:translate(-50%,-50%) rotate(-12deg) translate(-120px,0) scale(1.25,0.9);
}
70%{
transform:translate(-50%,-50%) rotate(-25deg) translate(-70px,-90px) scale(1.1,1.1);
}
100%{
transform:translate(-50%,-50%) rotate(0deg) translate(0,0) scale(1);
}
}

/* RIGHT: lustrzane LEFT */
@keyframes rightFlow{
0%{
transform:translate(-50%,-50%) rotate(0deg) translate(0,0) scale(1);
}
20%{
transform:translate(-50%,-50%) rotate(-8deg) translate(20px,10px) scale(1.05);
}
45%{
transform:translate(-50%,-50%) rotate(12deg) translate(120px,0) scale(1.25,0.9);
}
70%{
transform:translate(-50%,-50%) rotate(25deg) translate(70px,-90px) scale(1.1,1.1);
}
100%{
transform:translate(-50%,-50%) rotate(0deg) translate(0,0) scale(1);
}
}

/* DARK OVERLAY */
.galaxy-dark{
position:fixed;
inset:0;
z-index:-2;
background:radial-gradient(circle,
rgba(0,0,0,.2),
rgba(0,0,0,.85)
);
}

/* HEADER */
header{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
position:relative;
}

h1{
font-family:'Playfair Display',serif;
font-size:clamp(3rem,6vw,4.5rem);
}

h1 span{
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* LOGO */
.corner-logo{
position:fixed;
top:14px;
left:14px;
width:100px;
z-index:10001;
}

.corner-logo img{
width:100%;
animation:spin 8s linear infinite;
filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));
}

@keyframes spin{
0%{transform:rotateY(0deg)}
100%{transform:rotateY(360deg)}
}

</style>
</head>

<body>

<!-- GALAXY -->
<div class="galaxy-wrap">
  <div class="galaxy-left"></div>
  <div class="galaxy-right"></div>
  <div class="galaxy-core"></div>
</div>

<div class="galaxy-dark"></div>

<!-- LOGO -->
<div class="corner-logo">
<img src="/images/logoLEC.png" alt="logo">
</div>

<header>
<h1><span>Lucy</span>EpoxyStudio</h1>
<p>Exklusive Epoxidharz Möbel & Premium Design</p>
</header>

</body>
</html>
