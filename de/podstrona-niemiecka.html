<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Cinematic Gravity</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
color:#f4f4f4;
overflow:hidden;
height:100vh;
}

/* SCENE */
.scene{
position:fixed;
inset:0;
overflow:hidden;
z-index:-1;
}

/* LEFT / RIGHT */
.left,.right{
position:absolute;
top:50%;
left:50%;
width:180vw;
height:180vh;
transform:translate(-50%,-50%);
background-size:contain;
background-repeat:no-repeat;
background-position:center;
filter:blur(1px) saturate(1.3);
}

.left{background-image:url("/indexlucy.html/public/images/galaxy-left.png");}
.right{background-image:url("/indexlucy.html/public/images/galaxy-right.png");}

/* CORE */
.core{
position:absolute;
top:50%;
left:50%;
width:260px;
height:260px;
transform:translate(-50%,-50%);
background:url("/indexlucy.html/public/images/galaxy-core.png") center/contain no-repeat;
filter:drop-shadow(0 0 50px rgba(0,0,0,.9));
}

/* FLASH */
.flash{
position:absolute;
top:50%;
left:50%;
width:120px;
height:120px;
transform:translate(-50%,-50%);
border-radius:50%;
background:white;
opacity:0;
filter:blur(30px);
mix-blend-mode:screen;
}

/* DARK */
.dark{
position:fixed;
inset:0;
background:radial-gradient(circle,rgba(0,0,0,.2),rgba(0,0,0,.95));
}

/* LOGO */
.logo{
position:fixed;
top:14px;
left:14px;
width:100px;
z-index:10;
}
.logo img{
width:100%;
animation:spin 8s linear infinite;
}
@keyframes spin{
0%{transform:rotateY(0)}
100%{transform:rotateY(360deg)}
}

/* TEXT */
.hero{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

h1{
font-family:'Playfair Display';
font-size:clamp(3rem,6vw,4rem);
}

h1 span{
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* FAZY ANIMACJI */
.phase1 .left,
.phase1 .right{
animation:float 6s ease-in-out infinite;
}

@keyframes float{
0%{transform:translate(-50%,-50%) scale(1.05)}
50%{transform:translate(-50%,-50%) scale(1.1)}
100%{transform:translate(-50%,-50%) scale(1.05)}
}

.phase2 .left{
animation:pullLeft 3s forwards;
}

.phase2 .right{
animation:pullRight 3s forwards;
}

@keyframes pullLeft{
to{transform:translate(-70%,-50%) scale(.6) rotate(-10deg)}
}

@keyframes pullRight{
to{transform:translate(-30%,-50%) scale(.6) rotate(10deg)}
}

.phase3 .core{
animation:collapse 2s forwards;
}

.phase3 .flash{
animation:flash 1s forwards;
}

@keyframes collapse{
to{transform:translate(-50%,-50%) scale(2) rotate(360deg)}
}

@keyframes flash{
0%{opacity:0}
30%{opacity:1}
100%{opacity:0}
}

</style>
</head>

<body>

<div class="scene">
  <div class="left"></div>
  <div class="right"></div>
  <div class="core"></div>
  <div class="flash"></div>
</div>

<div class="dark"></div>

<div class="logo">
<img src="/images/logoLEC.png">
</div>

<div class="hero">
<h1><span>Lucy</span>EpoxyStudio</h1>
</div>

<script>
const body = document.body;

function startAnimation(){

/* FAZA 1 */
body.classList.add("phase1");

setTimeout(()=>{

/* FAZA 2 - grawitacja */
body.classList.remove("phase1");
body.classList.add("phase2");

}, 2500);

setTimeout(()=>{

/* FAZA 3 - kolaps */
body.classList.add("phase3");

}, 5500);

}

window.onload = startAnimation;
</script>

</body>
</html>
