<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Gravity Edition</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
color:#f4f4f4;
height:300vh; /* scroll engine */
overflow-x:hidden;
}

/* ================= SCENE ================= */

.scene{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
}

/* LEFT */
.left{
position:absolute;
top:50%;
left:50%;
width:160vw;
height:160vh;
background:url("/indexlucy.html/public/images/galaxy-left.png") center/contain no-repeat;
transform:translate(-50%,-50%);
filter:blur(1px) saturate(1.3);
transition:transform 0.2s linear, filter 0.2s;
}

/* RIGHT */
.right{
position:absolute;
top:50%;
left:50%;
width:160vw;
height:160vh;
background:url("/indexlucy.html/public/images/galaxy-right.png") center/contain no-repeat;
transform:translate(-50%,-50%);
filter:blur(1px) saturate(1.3);
transition:transform 0.2s linear, filter 0.2s;
}

/* CORE */
.core{
position:absolute;
top:50%;
left:50%;
width:260px;
height:260px;
background:url("/indexlucy.html/public/images/galaxy-core.png") center/contain no-repeat;
transform:translate(-50%,-50%);
filter:drop-shadow(0 0 40px rgba(0,0,0,.9));
transition:transform 0.2s linear, filter 0.2s;
}

/* SUPERNOVA FLASH */
.flash{
position:absolute;
top:50%;
left:50%;
width:100px;
height:100px;
transform:translate(-50%,-50%);
border-radius:50%;
background:white;
opacity:0;
filter:blur(20px);
transition:opacity 0.2s;
mix-blend-mode:screen;
}

/* DARK */
.dark{
position:fixed;
inset:0;
background:radial-gradient(circle,
rgba(0,0,0,.2),
rgba(0,0,0,.9)
);
}

/* LOGO */
.logo{
position:fixed;
top:14px;
left:14px;
width:100px;
z-index:10;
}
.logo img{
width:100%;
animation:spin 8s linear infinite;
}
@keyframes spin{
0%{transform:rotateY(0)}
100%{transform:rotateY(360deg)}
}

/* TEXT */
.content{
position:relative;
z-index:2;
text-align:center;
padding-top:40vh;
}
h1{
font-size:clamp(3rem,6vw,4rem);
font-family:'Playfair Display';
}
h1 span{
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

</style>
</head>

<body>

<div class="scene">
  <div class="left" id="left"></div>
  <div class="right" id="right"></div>
  <div class="core" id="core"></div>
  <div class="flash" id="flash"></div>
</div>

<div class="dark"></div>

<div class="logo">
<img src="/images/logoLEC.png">
</div>

<div class="content">
<h1><span>Lucy</span>EpoxyStudio</h1>
<p>Scroll to activate gravity</p>
</div>

<script>
const left = document.getElementById("left");
const right = document.getElementById("right");
const core = document.getElementById("core");
const flash = document.getElementById("flash");

window.addEventListener("scroll", () => {
let s = window.scrollY / (document.body.scrollHeight - window.innerHeight);

/* clamp */
s = Math.min(Math.max(s,0),1);

/* ================= GRAVITY ================= */

/* LEFT + RIGHT MOVE TO CORE */
const pull = s * 200;

left.style.transform =
`translate(-50%,-50%) translateX(${-pull}px) scale(${1 - s*0.2}) rotate(${s*10}deg)`;

right.style.transform =
`translate(-50%,-50%) translateX(${pull}px) scale(${1 - s*0.2}) rotate(${-s*10}deg)`;

/* CORE BREATH + COLLAPSE */
core.style.transform =
`translate(-50%,-50%) scale(${1 + s*0.6},${1 - s*0.4}) rotate(${s*180}deg)`;

/* SUPERNOVA */
flash.style.opacity = s > 0.6 ? (s-0.6)*2 : 0;
flash.style.transform =
`translate(-50%,-50%) scale(${1 + s*3})`;

});
</script>

</body>
</html>
