<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Cosmic System</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
overflow:hidden;
height:100vh;
color:#f4f4f4;
}

/* ================= LOGO ================= */

.corner-logo{
position:fixed;
top:14px;
left:14px;
width:100px;
z-index:1000;
}

.corner-logo img{
width:100%;
border-radius:12px;
animation:spinLogo 10s linear infinite;
filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));
}

@keyframes spinLogo{
0%{transform:rotateY(0deg)}
100%{transform:rotateY(360deg)}
}

/* ================= GALAXY ================= */

.scene{
position:fixed;
inset:0;
z-index:-3;
}

.left,.right{
position:absolute;
top:50%;
left:50%;
width:200vw;
height:200vh;
transform:translate(-50%,-50%);
background-size:contain;
background-repeat:no-repeat;
background-position:center;
filter:blur(1px) saturate(1.3);
}

.left{background-image:url("/indexlucy.html/public/images/galaxy-left.png");}
.right{background-image:url("/indexlucy.html/public/images/galaxy-right.png");}

.left{animation:driftL 22s ease-in-out infinite;}
.right{animation:driftR 26s ease-in-out infinite;}

@keyframes driftL{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-52%,-50%) rotate(-5deg)}
}

@keyframes driftR{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-48%,-50%) rotate(5deg)}
}

/* ================= CORE ================= */

.core{
position:absolute;
top:50%;
left:50%;
width:340px;
height:340px;
transform:translate(-50%,-50%);
background:url("/indexlucy.html/public/images/galaxy-core.png") center/contain no-repeat;
animation:
coreSpin 16s linear infinite,
corePulse 6s ease-in-out infinite;
}

@keyframes coreSpin{
0%{transform:translate(-50%,-50%) rotate(0deg)}
100%{transform:translate(-50%,-50%) rotate(-360deg)}
}

@keyframes corePulse{
0%,100%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.2)}
}

/* ================= FLARES ================= */

.flare{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
background:radial-gradient(circle,#fff6c8,#d4af37,transparent);
filter:blur(1px);
animation:flareMove 3.5s infinite ease-in-out;
opacity:.85;
mix-blend-mode:screen;
}

@keyframes flareMove{
0%{transform:translate(0,0) scale(.4);opacity:0}
30%{opacity:1}
100%{transform:translate(var(--x),var(--y)) scale(2);opacity:0}
}

/* ================= CAMERA FLASH ================= */

.camera-flash{
position:absolute;
width:4px;
height:4px;
border-radius:50%;
background:radial-gradient(circle,#ffffff,#fff2b2,#d4af37,transparent);
filter:blur(.5px);
mix-blend-mode:screen;
opacity:0;
animation:cameraFlash 2.8s ease-out infinite;
pointer-events:none;
}

@keyframes cameraFlash{
0%{transform:scale(.3);opacity:0}
5%{opacity:1}
25%{transform:scale(3);opacity:.9}
100%{transform:scale(.2);opacity:0}
}

/* ================= SUPERNOVA ================= */

.supernova{
position:absolute;
width:8px;
height:8px;
border-radius:50%;
background:radial-gradient(circle,#fff,#fff2b2,#d4af37,transparent);
filter:blur(1px);
mix-blend-mode:screen;
opacity:0;
animation:supernovaBurst 5s ease-in-out infinite;
pointer-events:none;
}

.supernova.small{width:5px;height:5px}
.supernova.medium{width:10px;height:10px}
.supernova.big{width:16px;height:16px;filter:blur(2px)}

@keyframes supernovaBurst{
0%{transform:translate(0,0) scale(.2);opacity:0}
15%{opacity:1}
100%{transform:translate(var(--x),var(--y)) scale(3);opacity:0}
}

/* ================= HERO ================= */

.hero{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
transform:translateY(90px);
}

h1{
font-family:'Playfair Display';
font-size:clamp(2.5rem,6vw,4rem);
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
color:transparent;
}

/* ================= MENU ================= */

.nav{
margin-top:25px;
display:flex;
gap:12px;
flex-wrap:wrap;
justify-content:center;
padding:12px 16px;
border-radius:20px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(18px);
border:1px solid rgba(212,175,55,0.15);
transition:transform .2s ease;
}

.nav a{
padding:12px 18px;
border-radius:14px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(212,175,55,0.25);
color:#f5e6b8;
text-decoration:none;
transition:transform .2s,box-shadow .3s;
}

.nav a:hover{
box-shadow:0 0 25px rgba(212,175,55,0.25);
}
</style>
</head>

<body>

<div class="scene">
<div class="left"></div>
<div class="right"></div>
<div class="core"></div>
</div>

<div class="hero">
<h1 id="brand">LucyEpoxyStudio</h1>

<div class="nav" id="glassNav">
<a href="/indexlucy.html/index.html">Sprache: Polnisch</a>
<a href="/indexlucy.html/en/index.html">Sprache: Englisch</a>
<a href="/indexlucy.html/de/realisierungen.html">Projekte</a>
<a href="/indexlucy.html/de/kontakt.html">Kontakt</a>
<a href="/indexlucy.html/de/android-app.html">App herunterladen</a>
</div>
</div>

<script>
/* CORE FLARES */
for(let i=0;i<18;i++){
const f=document.createElement("div");
f.className="flare";
f.style.left=50+Math.random()*10-5+"%";
f.style.top=50+Math.random()*10-5+"%";
f.style.setProperty("--x",(Math.random()*200-100)+"px");
f.style.setProperty("--y",(Math.random()*200-100)+"px");
f.style.animationDelay=Math.random()*3+"s";
document.body.appendChild(f);
}

/* SUPERNOVA BURSTS */
function spawnSupernova(){
const s=document.createElement("div");
const sizes=["small","medium","big"];
s.className="supernova "+sizes[Math.floor(Math.random()*sizes.length)];

s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";

s.style.setProperty("--x",(Math.random()*400-200)+"px");
s.style.setProperty("--y",(Math.random()*400-200)+"px");

document.body.appendChild(s);
setTimeout(()=>s.remove(),5000);
}

setInterval(spawnSupernova,900);

/* camera flash near menu */
function spawnFlash(){
const nav=document.getElementById("glassNav");
const rect=nav.getBoundingClientRect();

const f=document.createElement("div");
f.className="camera-flash";

f.style.left=(rect.left+Math.random()*rect.width)+"px";
f.style.top=(rect.top+Math.random()*rect.height)+"px";

document.body.appendChild(f);
setTimeout(()=>f.remove(),2800);
}
setInterval(()=>{for(let i=0;i<3;i++)spawnFlash()},700);

/* AI gravity menu */
const nav=document.getElementById("glassNav");
const items=nav.querySelectorAll("a");

document.addEventListener("mousemove",(e)=>{
const centerX=window.innerWidth/2;
const centerY=window.innerHeight/2;

const moveX=(e.clientX-centerX)*0.01;
const moveY=(e.clientY-centerY)*0.01;

nav.style.transform=`translate(${moveX}px,${moveY}px)`;

items.forEach(el=>{
const r=el.getBoundingClientRect();
const dx=centerX-(r.left+r.width/2);
const dy=centerY-(r.top+r.height/2);
const dist=Math.sqrt(dx*dx+dy*dy);
const force=Math.min(40/dist,0.6);
el.style.transform=`translate(${dx*force*0.1}px,${dy*force*0.1}px)`;
});
});
</script>

</body>
</html>
