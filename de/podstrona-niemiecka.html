<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Cosmic System</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
overflow:hidden;
height:100vh;
color:#f4f4f4;
}

/* ================= LOGO ================= */

.corner-logo{
position:fixed;
top:14px;
left:14px;
width:100px;
z-index:1000;
}

.corner-logo img{
width:100%;
border-radius:12px;
animation:spinLogo 12s linear infinite;
filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));
}

@keyframes spinLogo{
0%{transform:rotateY(0deg)}
100%{transform:rotateY(360deg)}
}

/* ================= GALAXY ================= */

.scene{
position:fixed;
inset:0;
z-index:-3;
}

.left,.right{
position:absolute;
top:50%;
left:50%;
width:200vw;
height:200vh;
transform:translate(-50%,-50%);
background-size:contain;
background-repeat:no-repeat;
background-position:center;
filter:blur(1px) saturate(1.3);
}

.left{background-image:url("/indexlucy.html/public/images/galaxy-left.png");}
.right{background-image:url("/indexlucy.html/public/images/galaxy-right.png");}

.left{animation:driftL 22s ease-in-out infinite;}
.right{animation:driftR 26s ease-in-out infinite;}

@keyframes driftL{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-52%,-50%) rotate(-5deg)}
}

@keyframes driftR{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-48%,-50%) rotate(5deg)}
}

/* ================= CORE ================= */

.core{
position:absolute;
top:50%;
left:50%;
width:340px;
height:340px;
transform:translate(-50%,-50%);
background:url("/indexlucy.html/public/images/galaxy-core.png") center/contain no-repeat;
animation:
coreSpin 16s linear infinite,
corePulse 6s ease-in-out infinite;
}

@keyframes coreSpin{
0%{transform:translate(-50%,-50%) rotate(0deg)}
100%{transform:translate(-50%,-50%) rotate(-360deg)}
}

@keyframes corePulse{
0%,100%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.2)}
}

/* ================= FLARES ================= */

.flare{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
background:radial-gradient(circle,#fff6c8,#d4af37,transparent);
filter:blur(1px);
animation:flareMove 3.5s infinite ease-in-out;
opacity:.85;
mix-blend-mode:screen;
}

@keyframes flareMove{
0%{transform:translate(0,0) scale(.4);opacity:0}
30%{opacity:1}
100%{transform:translate(var(--x),var(--y)) scale(2);opacity:0}
}

/* ================= CAMERA FLASH ================= */

.camera-flash{
position:absolute;
width:4px;
height:4px;
border-radius:50%;
background:radial-gradient(circle,#ffffff,#fff2b2,#d4af37,transparent);
filter:blur(.5px);
mix-blend-mode:screen;
opacity:0;
animation:cameraFlash 2.8s ease-out infinite;
pointer-events:none;
}

@keyframes cameraFlash{
0%{transform:scale(.3);opacity:0}
5%{opacity:1}
25%{transform:scale(3);opacity:.9}
100%{transform:scale(.2);opacity:0}
}

/* ================= SUPERNOVA ================= */

.supernova{
position:absolute;
width:8px;
height:8px;
border-radius:50%;
background:radial-gradient(circle,#fff,#fff2b2,#d4af37,transparent);
filter:blur(1px);
mix-blend-mode:screen;
opacity:0;
animation:supernovaBurst 5s ease-in-out infinite;
pointer-events:none;
}

.supernova.small{width:5px;height:5px}
.supernova.medium{width:10px;height:10px}
.supernova.big{width:18px;height:18px;filter:blur(2px)}

@keyframes supernovaBurst{
0%{transform:translate(0,0) scale(.2);opacity:0}
15%{opacity:1}
100%{transform:translate(var(--x),var(--y)) scale(3);opacity:0}
}

/* ================= HERO ================= */

.hero{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
transform:translateY(90px);
}

h1{
font-family:'Playfair Display';
font-size:clamp(2.5rem,6vw,4rem);
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
color:transparent;
}

/* ================= MENU ================= */

.nav{
margin-top:25px;
display:flex;
gap:12px;
flex-wrap:wrap;
justify-content:center;
padding:12px 16px;
border-radius:20px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(18px);
border:1px solid rgba(212,175,55,0.15);
transition:transform .2s ease;
}

.nav a{
padding:12px 18px;
border-radius:14px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(212,175,55,0.25);
color:#f5e6b8;
text-decoration:none;
transition:transform .2s,box-shadow .3s;
}

.nav a:hover{
box-shadow:0 0 25px rgba(212,175,55,0.25);
}

/* ================= MOBILE STABILITY ================= */
@media (max-width:768px){

.left,.right{
animation-duration:60s !important;
filter:blur(.5px) saturate(1.1);
}

@keyframes driftL{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-50.5%,-50%) rotate(-1.5deg)}
}

@keyframes driftR{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-49.5%,-50%) rotate(1.5deg)}
}

.core{
animation:
coreSpin 60s linear infinite,
corePulse 10s ease-in-out infinite;
}

.nav{
transition:none;
}

}
</style>
