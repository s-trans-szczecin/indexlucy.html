<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Cosmic System</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
overflow:hidden;
height:100vh;
color:#f4f4f4;
}

/* ================= LOGO ================= */

.corner-logo{
position:fixed;
top:14px;
left:14px;
width:100px;
z-index:1000;
}

.corner-logo img{
width:100%;
border-radius:12px;
animation:spinLogo 10s linear infinite;
filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));
}

@keyframes spinLogo{
0%{transform:rotateY(0deg)}
100%{transform:rotateY(360deg)}
}

/* ================= GALAXY ================= */

.scene{
position:fixed;
inset:0;
z-index:-3;
}

.left,.right{
position:absolute;
top:50%;
left:50%;
width:200vw;
height:200vh;
transform:translate(-50%,-50%);
background-size:contain;
background-repeat:no-repeat;
background-position:center;
filter:blur(1px) saturate(1.3);
}

.left{background-image:url("/indexlucy.html/public/images/galaxy-left.png");}
.right{background-image:url("/indexlucy.html/public/images/galaxy-right.png");}

.left{animation:driftL 22s ease-in-out infinite;}
.right{animation:driftR 26s ease-in-out infinite;}

@keyframes driftL{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-52%,-50%) rotate(-5deg)}
}

@keyframes driftR{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-48%,-50%) rotate(5deg)}
}

/* ================= CORE ================= */

.core{
position:absolute;
top:50%;
left:50%;
width:340px;
height:340px;
transform:translate(-50%,-50%);
background:url("/indexlucy.html/public/images/galaxy-core.png") center/contain no-repeat;
animation:
coreSpin 16s linear infinite,
corePulse 6s ease-in-out infinite;
}

@keyframes coreSpin{
0%{transform:translate(-50%,-50%) rotate(0deg)}
100%{transform:translate(-50%,-50%) rotate(-360deg)}
}

@keyframes corePulse{
0%,100%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.2)}
}

/* ================= FLARES ================= */

.flare{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
background:radial-gradient(circle,#fff6c8,#d4af37,transparent);
filter:blur(1px);
animation:flareMove 3.5s infinite ease-in-out;
opacity:.85;
mix-blend-mode:screen;
will-change:transform,opacity;
}

@keyframes flareMove{
0%{transform:translate(0,0) scale(.4);opacity:0}
30%{opacity:1}
100%{transform:translate(var(--x),var(--y)) scale(2);opacity:0}
}

/* ================= SUPERNOVA FIELD ================= */

.supernova{
position:absolute;
width:8px;
height:8px;
border-radius:50%;
background:radial-gradient(circle,
#ffffff 0%,
#fff2b2 20%,
#d4af37 45%,
transparent 75%);
filter:blur(1px);
mix-blend-mode:screen;
opacity:0;
animation:supernovaBurst 5s ease-in-out infinite;
will-change:transform,opacity;
pointer-events:none;
}

.supernova.small{
width:5px;
height:5px;
animation-duration:4s;
opacity:.7;
}

.supernova.medium{
width:10px;
height:10px;
animation-duration:5.5s;
}

.supernova.big{
width:16px;
height:16px;
filter:blur(2px);
animation-duration:6.5s;
box-shadow:0 0 20px rgba(255,210,120,.4);
}

@keyframes supernovaBurst{
0%{
transform:translate(0,0) scale(.2);
opacity:0;
}
15%{opacity:1;}
50%{opacity:.9;}
100%{
transform:translate(var(--x),var(--y)) scale(3);
opacity:0;
}
}

/* ================= TEXT ================= */

.hero{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

h1{
font-family:'Playfair Display';
font-size:clamp(2.5rem,6vw,4rem);
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
color:transparent;
}

/* ================= MENU ================= */

.nav{
margin-top:25px;
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
}

.nav a{
padding:10px 16px;
border-radius:30px;
border:1px solid rgba(212,175,55,.5);
color:#f5e6b8;
text-decoration:none;
background:rgba(0,0,0,.35);
}

.nav a:hover{
background:rgba(212,175,55,.2);
}

/* ================= PARTICLES ================= */

.particle{
position:absolute;
font-family:'Playfair Display',serif;
font-size:2rem;
font-weight:700;
color:#d4af37;
pointer-events:none;
text-shadow:0 0 10px rgba(212,175,55,.8);
animation:fly 1.6s ease-out forwards;
will-change:transform,opacity;
}

@keyframes fly{
0%{transform:translate(0,0) scale(1);opacity:1}
100%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}
}

.particle.rebuild{
animation:rebuild 1.4s ease-in forwards !important;
}

@keyframes rebuild{
0%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}
100%{transform:translate(0,0) scale(1);opacity:1}
}

</style>
</head>

<body>

<div class="corner-logo">
<img src="/images/logoLEC.png" alt="logo">
</div>

<div class="scene">
  <div class="left"></div>
  <div class="right"></div>
  <div class="core"></div>
</div>

<script>
/* FLARES */
for(let i=0;i<28;i++){
const f=document.createElement("div");
f.className="flare";
f.style.left=50+(Math.random()*12-6)+"%";
f.style.top=50+(Math.random()*12-6)+"%";
f.style.setProperty("--x",(Math.random()*260-130)+"px");
f.style.setProperty("--y",(Math.random()*260-130)+"px");
f.style.animationDelay=Math.random()*4+"s";
document.body.appendChild(f);
}

/* ================= SUPERNOVAS ================= */

function spawnSupernova(type){
const s=document.createElement("div");

s.className="supernova " + type;

const x=Math.random()*window.innerWidth;
const y=Math.random()*window.innerHeight;

const angle=Math.random()*Math.PI*2;
const dist=80+Math.random()*220;

s.style.left=x+"px";
s.style.top=y+"px";

s.style.setProperty("--x",Math.cos(angle)*dist+"px");
s.style.setProperty("--y",Math.sin(angle)*dist+"px");

document.body.appendChild(s);

setTimeout(()=>s.remove(),6500);
}

/* małe */
setInterval(()=>spawnSupernova("small"),180);

/* średnie */
setInterval(()=>spawnSupernova("medium"),500);

/* duże */
setInterval(()=>spawnSupernova("big"),1200);
</script>

<div class="hero">

<h1 id="brand">LucyEpoxyStudio</h1>

<div class="nav">
<a href="./index.html">PL</a>
<a href="../en/index.html">EN</a>
<a href="./realisierungen.html">Projects</a>
<a href="./kontakt.html">Contact</a>
<a href="./android-app.html">App</a>
</div>

</div>

<script>
const text=document.getElementById("brand");
let spans=[],particles=[];

function explode(){
const letters=text.innerText.split("");
text.innerHTML="";
letters.forEach(c=>{
const s=document.createElement("span");
s.innerText=c;
text.appendChild(s);
});

requestAnimationFrame(()=>{
spans=text.querySelectorAll("span");

spans.forEach(span=>{
const rect=span.getBoundingClientRect();

for(let i=0;i<2;i++){
const p=document.createElement("div");
p.className="particle";
p.innerText=span.innerText;

const a=Math.random()*Math.PI*2;
const d=60+Math.random()*120;

p.style.left=rect.left+"px";
p.style.top=rect.top+"px";
p.style.setProperty("--x",Math.cos(a)*d+"px");
p.style.setProperty("--y",Math.sin(a)*d-80+"px");

document.body.appendChild(p);
particles.push(p);
}

span.style.opacity="0";
});

setTimeout(rebuild,1800);
});
}

function rebuild(){
particles.forEach(p=>{
p.classList.add("rebuild");
setTimeout(()=>p.remove(),1400);
});

setTimeout(()=>{
text.innerHTML="LucyEpoxyStudio";
setTimeout(explode,2500);
},1500);
}

window.onload=()=>setTimeout(explode,1200);
</script>

</body>
</html>
