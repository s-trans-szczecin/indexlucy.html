<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Supernova Core</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
height:100vh;
overflow:hidden;
}

/* ================= SCENE ================= */

.scene{
position:fixed;
inset:0;
z-index:-2;
}

/* LEFT / RIGHT (SMOOTHER FLOAT) */

.left,.right{
position:absolute;
top:50%;
left:50%;
width:200vw;
height:200vh;
transform:translate(-50%,-50%);
background-size:contain;
background-repeat:no-repeat;
background-position:center;
filter:blur(1px) saturate(1.3);
will-change:transform;
}

.left{background-image:url("/indexlucy.html/public/images/galaxy-left.png");}
.right{background-image:url("/indexlucy.html/public/images/galaxy-right.png");}

/* soft rotation (CSS + JS mix feel) */
.left{animation:floatL 18s ease-in-out infinite;}
.right{animation:floatR 22s ease-in-out infinite;}

@keyframes floatL{
0%,100%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}
50%{transform:translate(-52%,-50%) rotate(-4deg) scale(1.05)}
}

@keyframes floatR{
0%,100%{transform:translate(-50%,-50%) rotate(0deg) scale(1)}
50%{transform:translate(-48%,-50%) rotate(4deg) scale(1.05)}
}

/* ================= CORE ================= */

.core{
position:absolute;
top:50%;
left:50%;
width:320px;
height:320px;
transform:translate(-50%,-50%);
background:url("/indexlucy.html/public/images/galaxy-core.png") center/contain no-repeat;
filter:drop-shadow(0 0 90px rgba(0,0,0,.95));

animation:
coreSpin 14s linear infinite,
corePulse 6s ease-in-out infinite,
coreBreath 4s ease-in-out infinite;
}

@keyframes coreSpin{
0%{transform:translate(-50%,-50%) rotate(0deg)}
100%{transform:translate(-50%,-50%) rotate(360deg)}
}

/* scale breathing */
@keyframes corePulse{
0%,100%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.15)}
}

/* dodatkowe „oddychanie” */
@keyframes coreBreath{
0%,100%{filter:drop-shadow(0 0 70px rgba(0,0,0,.9))}
50%{filter:drop-shadow(0 0 120px rgba(0,0,0,1))}
}

/* ================= FLASH SYSTEM ================= */

.flash,
.flash2,
.flash3{
position:absolute;
top:50%;
left:50%;
border-radius:50%;
background:white;
mix-blend-mode:screen;
opacity:0;
filter:blur(35px);
transform:translate(-50%,-50%);
}

/* MAIN FLASH */
.flash{
width:180px;
height:180px;
animation:flashMain 6s ease-in-out infinite;
}

/* secondary bursts */
.flash2{
width:300px;
height:300px;
animation:flash2 8s ease-in-out infinite;
border:1px solid rgba(255,255,255,.3);
}

.flash3{
width:500px;
height:500px;
animation:flash3 10s ease-in-out infinite;
border:1px solid rgba(212,175,55,.2);
}

@keyframes flashMain{
0%,80%,100%{opacity:0}
82%{opacity:1}
86%{opacity:.2}
}

@keyframes flash2{
0%,85%,100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
88%{opacity:.6;transform:translate(-50%,-50%) scale(1.3)}
}

@keyframes flash3{
0%,88%,100%{opacity:0}
90%{opacity:.4}
}

/* ================= DARK ================= */

.dark{
position:fixed;
inset:0;
background:radial-gradient(circle,rgba(0,0,0,.1),rgba(0,0,0,.95));
z-index:-3;
}

/* ================= LOGO ================= */

.logo{
position:fixed;
top:14px;
left:14px;
width:100px;
z-index:1000;
}
.logo img{
width:100%;
animation:spin 8s linear infinite;
}
@keyframes spin{
0%{transform:rotateY(0)}
100%{transform:rotateY(360deg)}
}

/* ================= HERO + MENU ================= */

.hero{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

h1{
font-family:'Playfair Display';
font-size:clamp(3rem,6vw,4rem);
}

h1 span{
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.nav{
margin-top:25px;
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
}

.nav a{
padding:10px 16px;
border-radius:30px;
border:1px solid rgba(212,175,55,.5);
color:#f5e6b8;
text-decoration:none;
background:rgba(0,0,0,.35);
backdrop-filter:blur(8px);
font-size:.85rem;
}

.nav a:hover{
background:rgba(212,175,55,.2);
}

</style>
</head>

<body>

<div class="scene">
  <div class="left"></div>
  <div class="right"></div>

  <div class="flash"></div>
  <div class="flash2"></div>
  <div class="flash3"></div>

  <div class="core"></div>
</div>

<div class="dark"></div>

<div class="logo">
<img src="/images/logoLEC.png">
</div>

<div class="hero">
<h1><span>Lucy</span>EpoxyStudio</h1>

<div class="nav">
<a href="../index.html">PL</a>
<a href="../en/index.html">EN</a>
<a href="realisierungen.html">Projects</a>
<a href="kontakt.html">Contact</a>
</div>

</div>

</body>
</html>
