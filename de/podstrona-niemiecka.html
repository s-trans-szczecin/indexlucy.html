<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Luxury Gravity Core</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
height:100vh;
overflow:hidden;
}

/* ================= SPACE ================= */

.scene{
position:fixed;
inset:0;
z-index:-2;
}

/* GALAXY BASE */
.left,.right{
position:absolute;
top:50%;
left:50%;
width:200vw;
height:200vh;
transform:translate(-50%,-50%);
background-size:contain;
background-repeat:no-repeat;
background-position:center;
filter:blur(1px) saturate(1.3);
}

.left{background-image:url("/indexlucy.html/public/images/galaxy-left.png");}
.right{background-image:url("/indexlucy.html/public/images/galaxy-right.png");}

/* soft drift */
.left{animation:driftL 20s ease-in-out infinite;}
.right{animation:driftR 24s ease-in-out infinite;}

@keyframes driftL{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-52%,-50%) rotate(-5deg)}
}

@keyframes driftR{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-48%,-50%) rotate(5deg)}
}

/* ================= CORE ================= */

.core{
position:absolute;
top:50%;
left:50%;
width:320px;
height:320px;
transform:translate(-50%,-50%);
background:url("/indexlucy.html/public/images/galaxy-core.png") center/contain no-repeat;
filter:drop-shadow(0 0 90px rgba(0,0,0,.95));

/* 🔥 LEFT SPIN + COLLAPSE */
animation:
coreSpinLeft 14s linear infinite,
coreFlatten 6s ease-in-out infinite;
}

/* obrót w LEWO */
@keyframes coreSpinLeft{
0%{transform:translate(-50%,-50%) rotate(0deg)}
100%{transform:translate(-50%,-50%) rotate(-360deg)}
}

/* spłaszczanie + oddychanie */
@keyframes coreFlatten{
0%,100%{transform:translate(-50%,-50%) scale(1,1)}
50%{transform:translate(-50%,-50%) scale(1.25,.75)}
}

/* ================= FLASH FIELD ================= */

.flash{
position:absolute;
top:50%;
left:50%;
width:140px;
height:140px;
border-radius:50%;
background:white;
opacity:0;
filter:blur(35px);
mix-blend-mode:screen;
animation:flashMain 5s ease-in-out infinite;
}

.flash2{
position:absolute;
top:40%;
left:60%;
width:220px;
height:220px;
border-radius:50%;
background:rgba(255,255,255,.6);
opacity:0;
filter:blur(40px);
mix-blend-mode:screen;
animation:flash2 7s ease-in-out infinite;
}

.flash3{
position:absolute;
top:60%;
left:40%;
width:320px;
height:320px;
border-radius:50%;
background:rgba(212,175,55,.4);
opacity:0;
filter:blur(50px);
mix-blend-mode:screen;
animation:flash3 9s ease-in-out infinite;
}

@keyframes flashMain{
0%,85%,100%{opacity:0}
87%{opacity:1}
90%{opacity:.2}
}

@keyframes flash2{
0%,80%,100%{opacity:0}
82%{opacity:.6}
88%{opacity:0}
}

@keyframes flash3{
0%,88%,100%{opacity:0}
90%{opacity:.4}
92%{opacity:0}
}

/* ================= DARK ================= */

.dark{
position:fixed;
inset:0;
background:radial-gradient(circle,rgba(0,0,0,.1),rgba(0,0,0,.95));
z-index:-3;
}

/* ================= LOGO ================= */

.logo{
position:fixed;
top:14px;
left:14px;
width:100px;
z-index:1000;
}
.logo img{
width:100%;
animation:spin 8s linear infinite;
}
@keyframes spin{
0%{transform:rotateY(0)}
100%{transform:rotateY(360deg)}
}

/* ================= HERO TEXT ================= */

.hero{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

/* GOLD TEXT + SPARKLES */
h1{
font-family:'Playfair Display';
font-size:clamp(3rem,6vw,4rem);
position:relative;
display:inline-block;
color:transparent;
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
}

/* SPARKLES OVER TEXT */
h1::before,
h1::after{
content:"";
position:absolute;
inset:-20px;
background:
radial-gradient(circle at 20% 30%,rgba(255,255,255,.8),transparent 6px),
radial-gradient(circle at 70% 60%,rgba(255,255,255,.6),transparent 5px),
radial-gradient(circle at 40% 80%,rgba(255,255,255,.4),transparent 4px);
opacity:.8;
filter:blur(.5px);
animation:sparkle 3s infinite alternate;
pointer-events:none;
}

@keyframes sparkle{
0%{transform:scale(1);opacity:.4}
100%{transform:scale(1.1);opacity:.9}
}

/* NAV */
.nav{
margin-top:25px;
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
}

.nav a{
padding:10px 16px;
border-radius:30px;
border:1px solid rgba(212,175,55,.5);
color:#f5e6b8;
text-decoration:none;
background:rgba(0,0,0,.35);
backdrop-filter:blur(8px);
font-size:.85rem;
}

.nav a:hover{
background:rgba(212,175,55,.2);
}

</style>
</head>

<body>

<div class="scene">
  <div class="left"></div>
  <div class="right"></div>

  <div class="flash"></div>
  <div class="flash2"></div>
  <div class="flash3"></div>

  <div class="core"></div>
</div>

<div class="dark"></div>

<div class="logo">
<img src="/images/logoLEC.png">
</div>

<div class="hero">
<h1>LucyEpoxyStudio</h1>

<div class="nav">
<a href="../index.html">PL</a>
<a href="../en/index.html">EN</a>
<a href="realisierungen.html">Projects</a>
<a href="kontakt.html">Contact</a>
</div>

</div>

</body>
</html>
