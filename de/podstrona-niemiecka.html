<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Vision UI System</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
overflow:hidden;
height:100vh;
color:#f4f4f4;
}

/* ================= GALAXY ================= */

.scene{
position:fixed;
inset:0;
z-index:-5;
}

.left,.right{
position:absolute;
top:50%;
left:50%;
width:220vw;
height:220vh;
transform:translate(-50%,-50%);
background-size:contain;
background-repeat:no-repeat;
background-position:center;
filter:blur(1.2px) saturate(1.4);
opacity:.9;
}

.left{background-image:url("/indexlucy.html/public/images/galaxy-left.png");animation:driftL 26s ease-in-out infinite;}
.right{background-image:url("/indexlucy.html/public/images/galaxy-right.png");animation:driftR 30s ease-in-out infinite;}

@keyframes driftL{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-52%,-50%) rotate(-6deg)}
}

@keyframes driftR{
0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
50%{transform:translate(-48%,-50%) rotate(6deg)}
}

/* ================= CORE (GRAVITY ENGINE) ================= */

.core{
position:absolute;
top:50%;
left:50%;
width:360px;
height:360px;
transform:translate(-50%,-50%);
background:url("/indexlucy.html/public/images/galaxy-core.png") center/contain no-repeat;
animation:coreSpin 18s linear infinite, corePulse 7s ease-in-out infinite;
filter:drop-shadow(0 0 40px rgba(212,175,55,.3));
}

@keyframes coreSpin{
0%{transform:translate(-50%,-50%) rotate(0deg)}
100%{transform:translate(-50%,-50%) rotate(-360deg)}
}

@keyframes corePulse{
0%,100%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.25)}
}

/* ================= FLARES (IMPORTANT!) ================= */

.flare{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
background:radial-gradient(circle,#fff6c0,#d4af37,transparent);
filter:blur(1px);
animation:flareMove 4s ease-in-out infinite;
opacity:.9;
mix-blend-mode:screen;
}

@keyframes flareMove{
0%{transform:translate(0,0) scale(.3);opacity:0}
30%{opacity:1}
100%{transform:translate(var(--x),var(--y)) scale(2);opacity:0}
}

/* ================= VISION PRO GLASS UI ================= */

.hero{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
backdrop-filter:blur(2px);
}

h1{
font-family:'Playfair Display';
font-size:clamp(2.5rem,6vw,4rem);
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
color:transparent;
text-shadow:0 0 30px rgba(212,175,55,.15);
animation:introGlow 6s ease-in-out infinite;
}

@keyframes introGlow{
0%,100%{filter:brightness(1)}
50%{filter:brightness(1.4)}
}

/* ================= GLASS MENU ================= */

.nav{
margin-top:30px;
display:flex;
gap:12px;
flex-wrap:wrap;
justify-content:center;
}

.nav a{
padding:12px 18px;
border-radius:18px;
background:rgba(255,255,255,.06);
border:1px solid rgba(212,175,55,.25);
backdrop-filter:blur(14px);
color:#f5e6b8;
text-decoration:none;
transition:.3s;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.nav a:hover{
transform:translateY(-4px) scale(1.05);
background:rgba(212,175,55,.18);
box-shadow:0 0 25px rgba(212,175,55,.4);
}

/* ================= PARTICLES ================= */

.particle{
position:absolute;
font-family:'Playfair Display',serif;
font-size:2rem;
font-weight:700;
color:#d4af37;
pointer-events:none;
text-shadow:0 0 15px rgba(212,175,55,.9);
animation:fly 1.8s ease-out forwards;
}

@keyframes fly{
0%{transform:translate(0,0) scale(1);opacity:1}
100%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}
}

.particle.rebuild{
animation:rebuild 1.5s ease-in forwards !important;
}

@keyframes rebuild{
0%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}
100%{transform:translate(0,0) scale(1);opacity:1}
}

</style>
</head>

<body>

<!-- GALAXY SYSTEM -->
<div class="scene">
  <div class="left"></div>
  <div class="right"></div>
  <div class="core"></div>
</div>

<!-- FLARES ENGINE -->
<script>
for(let i=0;i<25;i++){
const f=document.createElement("div");
f.className="flare";
f.style.left=50+Math.random()*10-5+"%";
f.style.top=50+Math.random()*10-5+"%";
f.style.setProperty("--x",(Math.random()*260-130)+"px");
f.style.setProperty("--y",(Math.random()*260-130)+"px");
f.style.animationDelay=Math.random()*4+"s";
document.body.appendChild(f);
}
</script>

<!-- UI -->
<div class="hero">

<h1 id="brand">LucyEpoxyStudio</h1>

<div class="nav">
<a href="#">PL</a>
<a href="#">EN</a>
<a href="#">Projects</a>
<a href="#">Contact</a>
<a href="#">App</a>
</div>

</div>

<!-- TEXT + PARTICLE ENGINE -->
<script>
const text=document.getElementById("brand");
let spans=[],particles=[];

function explode(){
const letters=text.innerText.split("");
text.innerHTML="";

letters.forEach(c=>{
const s=document.createElement("span");
s.innerText=c;
text.appendChild(s);
});

requestAnimationFrame(()=>{
spans=text.querySelectorAll("span");

spans.forEach(span=>{
const rect=span.getBoundingClientRect();

for(let i=0;i<2;i++){
const p=document.createElement("div");
p.className="particle";
p.innerText=span.innerText;

const a=Math.random()*Math.PI*2;
const d=70+Math.random()*140;

p.style.left=rect.left+"px";
p.style.top=rect.top+"px";
p.style.setProperty("--x",Math.cos(a)*d+"px");
p.style.setProperty("--y",Math.sin(a)*d-90+"px");

document.body.appendChild(p);
particles.push(p);
}

span.style.opacity="0";
});

setTimeout(rebuild,2000);
});
}

function rebuild(){
particles.forEach(p=>{
p.classList.add("rebuild");
setTimeout(()=>p.remove(),1500);
});

setTimeout(()=>{
text.innerHTML="LucyEpoxyStudio";
setTimeout(explode,3000);
},1600);
}

window.onload=()=>setTimeout(explode,1200);
</script>

</body>
</html>
