<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Gravity Core</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
color:#f4f4f4;
overflow:hidden;
height:100vh;
}

/* ================= SCENE ================= */

.scene{
position:fixed;
inset:0;
z-index:-2;
overflow:hidden;
}

.left,.right{
position:absolute;
top:50%;
left:50%;
width:180vw;
height:180vh;
transform:translate(-50%,-50%);
background-size:contain;
background-repeat:no-repeat;
background-position:center;
filter:blur(1px) saturate(1.3);
animation:pulse 6s ease-in-out infinite;
}

.left{background-image:url("/indexlucy.html/public/images/galaxy-left.png");}
.right{background-image:url("/indexlucy.html/public/images/galaxy-right.png");}

@keyframes pulse{
0%,100%{transform:translate(-50%,-50%) scale(1.02)}
50%{transform:translate(-50%,-50%) scale(1.08)}
}

/* ================= CORE ================= */

.core{
position:absolute;
top:50%;
left:50%;
width:280px;
height:280px;
transform:translate(-50%,-50%);
background:url("/indexlucy.html/public/images/galaxy-core.png") center/contain no-repeat;
filter:drop-shadow(0 0 60px rgba(0,0,0,.95));

/* 🔥 wolniejsze 50% */
animation:coreSpin 16s linear infinite, coreBreath 5s ease-in-out infinite;
}

@keyframes coreSpin{
0%{transform:translate(-50%,-50%) rotate(0deg)}
100%{transform:translate(-50%,-50%) rotate(360deg)}
}

@keyframes coreBreath{
0%,100%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.12)}
}

/* ================= SUPERNOVA ================= */

.flash{
position:absolute;
top:50%;
left:50%;
width:140px;
height:140px;
transform:translate(-50%,-50%);
border-radius:50%;
background:white;
opacity:0;
filter:blur(35px);
mix-blend-mode:screen;
}

.burst{
position:absolute;
top:50%;
left:50%;
width:300px;
height:300px;
transform:translate(-50%,-50%);
border-radius:50%;
border:2px solid rgba(212,175,55,.6);
opacity:0;
}

/* ================= DARK ================= */

.dark{
position:fixed;
inset:0;
background:radial-gradient(circle,rgba(0,0,0,.15),rgba(0,0,0,.95));
z-index:-3;
}

/* ================= LOGO ================= */

.logo{
position:fixed;
top:14px;
left:14px;
width:100px;
z-index:1000;
}
.logo img{
width:100%;
animation:spin 8s linear infinite;
}
@keyframes spin{
0%{transform:rotateY(0)}
100%{transform:rotateY(360deg)}
}

/* ================= MENU (FIX) ================= */

.nav{
position:fixed;
top:20px;
right:20px;
z-index:1001;
display:flex;
gap:10px;
}

.nav a{
padding:10px 16px;
border-radius:30px;
border:1px solid rgba(212,175,55,.5);
color:#f5e6b8;
text-decoration:none;
background:rgba(0,0,0,.3);
backdrop-filter:blur(6px);
font-size:.85rem;
}

.nav a:hover{
background:rgba(212,175,55,.2);
}

/* ================= TEXT ================= */

.hero{
position:relative;
z-index:2;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

h1{
font-family:'Playfair Display';
font-size:clamp(3rem,6vw,4rem);
}

h1 span{
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

</style>
</head>

<body>

<!-- GALAXY -->
<div class="scene">
  <div class="left"></div>
  <div class="right"></div>
  <div class="core"></div>
  <div class="flash" id="flash"></div>
  <div class="burst" id="burst"></div>
</div>

<div class="dark"></div>

<!-- LOGO -->
<div class="logo">
<img src="/images/logoLEC.png">
</div>

<!-- MENU (WRACA) -->
<div class="nav">
<a href="../index.html">PL</a>
<a href="../en/index.html">EN</a>
<a href="realisierungen.html">Projects</a>
<a href="kontakt.html">Contact</a>
</div>

<!-- HERO -->
<div class="hero">
<h1><span>Lucy</span>EpoxyStudio</h1>
</div>

<script>
const flash = document.getElementById("flash");
const burst = document.getElementById("burst");

/* AUTOMATIC CINEMATIC FLOW */
setTimeout(()=>{

/* SUPERNOVA FLASH */
flash.style.transition="opacity .4s";
flash.style.opacity=1;

burst.style.transition="all .8s ease-out";
burst.style.opacity=1;
burst.style.transform="translate(-50%,-50%) scale(2.5)";

/* fade out */
setTimeout(()=>{
flash.style.opacity=0;
burst.style.opacity=0;
},800);

},4000);

</script>

</body>
</html>
