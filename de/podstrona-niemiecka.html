<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Epoxidharz Möbel Deutschland</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Inter',sans-serif;
background:#050505;
color:#f4f4f4;
line-height:1.7;
overflow-x:hidden;
position:relative;
}

/* ================= GALAXY + BLACK HOLE ================= */

.galaxy-wrap{
position:fixed;
inset:0;
z-index:-3;
overflow:hidden;
pointer-events:none;
}

/* GALAXY BACKGROUND */
.galaxy{
position:absolute;
top:50%;
left:50%;
width:160vw;
height:160vh;
background:url("/indexlucy.html/public/images/galaxy.png") center/contain no-repeat;
transform:translate(-50%,-50%);
opacity:.85;
filter:blur(1px) saturate(1.3);
animation:galaxyFlow 18s ease-in-out infinite alternate;
}

@keyframes galaxyFlow{
0%{transform:translate(-50%,-50%) scale(1.05);}
100%{transform:translate(-50%,-50%) scale(1.18);}
}

/* ================= BLACK HOLE (EPICENTRUM) ================= */

.blackhole{
position:absolute;
top:50%;
left:50%;
width:240px;
height:240px;
transform:translate(-50%,-50%);
border-radius:50%;

/* ciemny rdzeń */
background:radial-gradient(circle,
rgba(0,0,0,1) 0%,
rgba(0,0,0,.9) 30%,
rgba(0,0,0,0) 70%
);

box-shadow:
0 0 40px rgba(0,0,0,.9),
0 0 120px rgba(0,0,0,.6);

animation:spinHole 4s linear infinite;
}

/* ring / horyzont zdarzeń */
.blackhole::before{
content:"";
position:absolute;
inset:-90px;
border-radius:50%;
background:conic-gradient(
from 0deg,
transparent 0%,
rgba(212,175,55,.25) 10%,
transparent 25%,
rgba(255,255,255,.08) 40%,
transparent 60%,
rgba(212,175,55,.2) 75%,
transparent 100%
);

filter:blur(6px);
animation:spinHole 2.5s linear infinite reverse;
mix-blend-mode:screen;
}

/* zasysanie przestrzeni */
.blackhole::after{
content:"";
position:absolute;
inset:-220px;
border-radius:50%;
background:radial-gradient(circle,
transparent 40%,
rgba(0,0,0,.4) 70%,
rgba(0,0,0,.95) 100%
);

animation:pull 6s ease-in-out infinite;
}

@keyframes spinHole{
0%{transform:rotate(0deg) scale(1);}
100%{transform:rotate(360deg) scale(1);}
}

@keyframes pull{
0%,100%{transform:scale(1);}
50%{transform:scale(1.12);}
}

/* dark overlay */
.galaxy-dark{
position:fixed;
inset:0;
z-index:-2;
background:radial-gradient(circle at center,
rgba(0,0,0,.25),
rgba(0,0,0,.8)
);
}

/* GRID */
body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
z-index:0;
background:
repeating-linear-gradient(90deg, rgba(212,175,55,.06) 0 2px, transparent 2px 30px),
repeating-linear-gradient(0deg, rgba(212,175,55,.04) 0 2px, transparent 2px 30px);
opacity:.25;
}

/* HEADER */
header{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:2rem;
position:relative;
}

h1{
font-family:'Playfair Display',serif;
font-size:clamp(3rem,6vw,4.5rem);
}

h1 span{
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero-text{
max-width:760px;
margin-top:1.2rem;
font-size:1.2rem;
color:#e0e0e0;
}

.nav-buttons{
margin-top:2rem;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:.8rem;
}

.cta{
display:inline-block;
padding:1rem 1.7rem;
border-radius:50px;
border:1px solid rgba(212,175,55,.6);
background:rgba(255,255,255,.06);
color:#f5e6b8;
text-decoration:none;
transition:.4s;
}

.cta:hover{
background:rgba(212,175,55,.25);
transform:translateY(-4px);
box-shadow:0 25px 50px rgba(212,175,55,.4);
}

/* LOGO */
.corner-logo{
position:fixed;
top:14px;
left:14px;
z-index:10001;
width:100px;
perspective:1000px;
}

.corner-logo img{
width:100%;
border-radius:12px;
animation:spin3d 8s linear infinite;
transform-origin:center;
transform-style:preserve-3d;
filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));
}

@keyframes spin3d{
0%{transform:rotateY(0deg)}
100%{transform:rotateY(360deg)}
}

/* MOBILE */
@media(max-width:768px){
.corner-logo{width:70px;top:10px;left:10px}
header{padding-top:90px}
h1{font-size:2rem}
}

</style>
</head>

<body>

<!-- GALAXY + BLACK HOLE -->
<div class="galaxy-wrap">
  <div class="galaxy"></div>
  <div class="blackhole"></div>
</div>

<div class="galaxy-dark"></div>

<!-- LOGO -->
<div class="corner-logo">
<img src="/images/logoLEC.png" alt="Lucy Epoxy Studio logo"
onerror="if(!this.dataset.step){this.dataset.step='1';this.src='images/logoLEC.png';}
else if(this.dataset.step==='1'){this.dataset.step='2';this.src='public/images/logoLEC.png';}
else if(this.dataset.step==='2'){this.dataset.step='3';this.src='/images/logoLEC.png';}
else if(this.dataset.step==='3'){this.dataset.step='4';this.src='logoLEC.png';}
else if(this.dataset.step==='4'){this.dataset.step='5';this.src='/logoLEC.png';}
else if(this.dataset.step==='5'){this.dataset.step='6';this.src='images/logoLEC.PNG';}
else{this.onerror=null;this.src='/favicon.svg';}">
</div>

<header>
<h1><span>Lucy</span>EpoxyStudio</h1>

<p class="hero-text">
Exklusive Epoxidharz-Möbel und handgefertigte Premium-Designs für den deutschen Markt.
</p>

<a class="cta" href="android-app.html">Android App</a>
<a class="cta" href="realisierungen.html">Realisierungen</a>
</div>
</header>

</body>
</html>
