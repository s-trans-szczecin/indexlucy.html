<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Inter,sans-serif;
background:#050505;
color:#fff;
overflow-x:hidden;
}

/* ===== GALAXY BACKGROUND (WORKING 100%) ===== */
.hero-bg{
position:fixed;
inset:0;
z-index:-2;
background:
radial-gradient(circle at 20% 30%, rgba(255,215,0,.25), transparent 40%),
radial-gradient(circle at 70% 60%, rgba(0,180,255,.15), transparent 50%),
radial-gradient(circle at 40% 80%, rgba(160,80,255,.15), transparent 55%),
radial-gradient(circle at 60% 20%, rgba(255,255,255,.08), transparent 60%),
linear-gradient(120deg,#050505,#0a0a0a);
animation:move 18s ease-in-out infinite;
filter:contrast(1.2) saturate(1.2);
}

@keyframes move{
0%{transform:scale(1.1) translateX(-2%) translateY(-1%)}
50%{transform:scale(1.2) translateX(3%) translateY(2%)}
100%{transform:scale(1.1) translateX(-2%) translateY(-1%)}
}

/* overlay for readability */
.overlay{
position:fixed;
inset:0;
z-index:-1;
background:radial-gradient(circle, rgba(0,0,0,.2), rgba(0,0,0,.85));
}

/* ===== HEADER ===== */
header{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:2rem;
position:relative;
}

h1{
font-family:"Playfair Display",serif;
font-size:clamp(2.5rem,6vw,4.5rem);
}

h1 span{
background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero-text{
max-width:700px;
margin-top:20px;
color:#ddd;
}

/* ===== BUTTONS ===== */
.nav{
margin-top:30px;
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

.btn{
padding:12px 18px;
border-radius:30px;
border:1px solid gold;
color:#f5e6b8;
text-decoration:none;
transition:.3s;
}

.btn:hover{
background:gold;
color:black;
}

/* ===== LOGO ===== */
.logo{
position:fixed;
top:14px;
left:14px;
width:90px;
animation:spin 8s linear infinite;
z-index:1000;
}

.logo img{
width:100%;
border-radius:10px;
filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));
}

@keyframes spin{
0%{transform:rotateY(0deg)}
100%{transform:rotateY(360deg)}
}

/* ===== MOBILE FIX ===== */
@media(max-width:768px){
h1{font-size:2rem;line-height:1.2}
.hero-text{padding:0 10px}
.logo{width:65px;top:10px;left:10px}
header{padding-top:100px}
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="hero-bg"></div>
<div class="overlay"></div>

<!-- LOGO -->
<div class="logo">
<img src="/images/logoLEC.png" alt="logo">
</div>

<!-- CONTENT -->
<header>
<h1><span>Lucy</span>EpoxyStudio</h1>

<p class="hero-text">
Exklusive Epoxidharz Möbel und Premium Design für den deutschen Markt.
</p>

<div class="nav">
<a class="btn" href="../index.html">Polska</a>
<a class="btn" href="../en/index.html">English</a>
<a class="btn" href="premium-projekt.html">Premium</a>
<a class="btn" href="kontakt.html">Kontakt</a>
<a class="btn" href="realisierungen.html">Projekte</a>
</div>

</header>

</body>
</html>
