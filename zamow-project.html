<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamów projekt | LucyEpoxyStudio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:#f4f4f4;
}

/* TŁO */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    repeating-linear-gradient(90deg, rgba(212,175,55,.05) 0 2px, transparent 2px 30px),
    repeating-linear-gradient(0deg, rgba(212,175,55,.04) 0 2px, transparent 2px 30px);
}

/* CONTENT NAD TŁEM */
header, section, footer{
  position:relative;
  z-index:2;
}

/* HEADER */
header{
  min-height:50vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
header h1{
  font-family:'Playfair Display',serif;
  font-size:3rem;
  color:#f5e6b8;
}

/* SECTION */
section{
  max-width:1400px;
  margin:auto;
  padding:3rem 6%;
}

/* INFO */
.pre-info{
  text-align:center;
  font-size:1.15rem;
  margin-bottom:3rem;
}

/* LAYOUT */
.cinema-row{
  display:flex;
  align-items:center;
  gap:3rem;
}

/* EKRAN */
#cinema{
  position:relative;
  flex:1;
  padding-bottom:56.25%;
  background:#000;
  border-radius:22px;
  overflow:hidden;
  z-index:1;
}
#cinema video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}

/* PROJEKTOR */
.projector-wrap{
  position:relative;
  width:240px;
  flex-shrink:0;
  z-index:50;
}
.projector-wrap img{
  width:100%;
  display:block;
  position:relative;
  z-index:50;
}

/* ZŁOTA, MIENIĄCA SIĘ SMUGA */
.beam{
  position:absolute;
  right:100%;
  top:50%;
  transform:translateY(-50%);
  width:480px;
  height:220px;
  background:linear-gradient(90deg,
    rgba(255,215,120,.55),
    rgba(212,175,55,.35),
    rgba(212,175,55,.15),
    rgba(212,175,55,0)
  );
  filter:blur(18px);
  pointer-events:none;
  z-index:10;
  animation:
    beamPulse 3s ease-in-out infinite,
    beamFlicker .18s linear infinite;
}

/* „oddychanie” światła */
@keyframes beamPulse{
  0%,100%{
    opacity:.55;
    transform:translateY(-50%) scaleX(1);
  }
  50%{
    opacity:.9;
    transform:translateY(-50%) scaleX(1.05);
  }
}

/* subtelne migotanie */
@keyframes beamFlicker{
  0%{filter:blur(17px)}
  50%{filter:blur(19px)}
  100%{filter:blur(18px)}
}

/* MOBILE */
@media(max-width:900px){
  .cinema-row{
    flex-direction:column;
  }
  .beam{display:none}
}

footer{
  text-align:center;
  padding:3rem;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>Zamów projekt</h1>
</header>

<section>

<p class="pre-info">
To nie jest wizualizacja — to realna projekcja fragmentu naszej realizacji.
</p>

<div class="cinema-row">

  <div id="cinema">
    <video
      id="film"
      src="wideo.mp4"
      autoplay
      muted
      loop
      playsinline>
    </video>
  </div>

  <div class="projector-wrap">
    <div class="beam"></div>
    <img src="projector.png" alt="Projektor">
  </div>

</div>

</section>

<footer>
© LucyEpoxyStudio · Ultra-Lux Design
</footer>

<script>
const v = document.getElementById('film');

v.muted = true;
v.playsInline = true;

function startVideo(){
  const p = v.play();
  if(p !== undefined){
    p.catch(()=>{});
  }
}

v.addEventListener('loadeddata', startVideo);
v.addEventListener('canplaythrough', startVideo);

document.addEventListener('visibilitychange', () => {
  if(!document.hidden){
    startVideo();
  }
});

setTimeout(startVideo, 300);
</script>

</body>
</html>
