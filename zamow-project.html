<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamów projekt | LucyEpoxyStudio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: #050505;
  color: #f4f4f4;
  overflow-x: hidden;
}

/* ================= HEADER ================= */
header {
  min-height: 50vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ================= KINO ================= */
#cinema-wrapper {
  position: relative;
  padding: 6rem 1rem 8rem;
  display: flex;
  justify-content: center;
}

/* PROJEKTOR */
#projector {
  position: absolute;
  top: -80px;
  width: 180px;
  height: 60px;
  background: linear-gradient(145deg, #1a1a1a, #000);
  border-radius: 14px;
  box-shadow: 0 15px 40px rgba(0,0,0,.9);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #d4af37;
  letter-spacing: 3px;
  font-size: .8rem;
  opacity: 0;
  animation: projectorIn 1.6s forwards;
}

/* SOCZEWKA */
#projector::after {
  content: "";
  position: absolute;
  right: 14px;
  width: 18px;
  height: 18px;
  background: radial-gradient(circle, #fff 0%, #d4af37 45%, #000 70%);
  border-radius: 50%;
}

/* STOŻEK ŚWIATŁA */
#beam {
  position: absolute;
  top: -20px;
  width: 0;
  height: 0;
  border-left: 260px solid transparent;
  border-right: 260px solid transparent;
  border-bottom: 620px solid rgba(212,175,55,0.10);
  opacity: 0;
  animation: beamOn 2s 1.2s forwards;
  filter: blur(1px);
}

/* EKRAN */
#cinema {
  position: relative;
  width: 100%;
  max-width: 900px;
  padding-bottom: 56.25%;
  background: #000;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0,0,0,.85);
}

#screen {
  position: absolute;
  top: -100%;
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: screenDrop 2s 1.8s forwards;
}

#screen video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ================= ANIMACJE ================= */
@keyframes projectorIn {
  from { transform: translateY(-60px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes beamOn {
  to { opacity: 1; }
}

@keyframes screenDrop {
  to { top: 0; }
}
</style>
</head>

<body>

<header></header>

<div id="cinema-wrapper">
  <div id="projector">PROJECTOR</div>
  <div id="beam"></div>

  <div id="cinema">
    <div id="screen">
      <video
        id="video"
        src="wideo.mp4"
        autoplay
        playsinline
        loop
      ></video>
    </div>
  </div>
</div>

<script>
window.addEventListener("load", () => {
  const video = document.getElementById("video");

  // próba wymuszenia dźwięku
  video.muted = false;
  const playPromise = video.play();

  if (playPromise !== undefined) {
    playPromise.catch(() => {
      // jeśli przeglądarka zablokuje audio – ruszy po pierwszym kliknięciu
      document.body.addEventListener("click", () => {
        video.muted = false;
        video.play();
      }, { once: true });
    });
  }
});
</script>

</body>
</html>
