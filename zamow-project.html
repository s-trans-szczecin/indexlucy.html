<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamów projekt | LucyEpoxyStudio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: #050505;
  color: #f4f4f4;
  overflow-x: hidden;
}

/* ================= HEADER ================= */
header {
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 4rem 2rem;
}

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.5rem, 6vw, 3.5rem);
  color: #f5e6b8;
}

header p {
  max-width: 760px;
  margin-top: 1.2rem;
  font-size: 1.1rem;
  color: #e0e0e0;
}

.cta {
  margin-top: 2rem;
  padding: 1rem 2.8rem;
  border-radius: 50px;
  border: 1px solid rgba(212,175,55,.6);
  background: rgba(255,255,255,.06);
  color: #f5e6b8;
  cursor: pointer;
  transition: .4s;
}

.cta:hover {
  background: rgba(212,175,55,.25);
  transform: translateY(-4px);
  box-shadow: 0 25px 50px rgba(212,175,55,.4);
}

/* ================= KINO ================= */
#cinema-wrapper {
  position: relative;
  padding: 6rem 1rem;
  display: flex;
  justify-content: center;
}

/* PROJEKTOR */
#projector {
  position: absolute;
  top: 0;
  width: 160px;
  height: 60px;
  background: linear-gradient(145deg, #222, #000);
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #d4af37;
  font-size: .9rem;
  letter-spacing: 2px;
  opacity: 0;
  animation: projectorIn 1.5s forwards;
}

/* SOCZEWKA */
#projector::after {
  content: "";
  position: absolute;
  right: 10px;
  width: 16px;
  height: 16px;
  background: radial-gradient(circle, #ffd 0%, #d4af37 40%, #000 70%);
  border-radius: 50%;
}

/* STOŻEK ŚWIATŁA */
#beam {
  position: absolute;
  top: 60px;
  width: 0;
  height: 0;
  border-left: 220px solid transparent;
  border-right: 220px solid transparent;
  border-bottom: 520px solid rgba(212,175,55,0.08);
  opacity: 0;
  animation: beamOn 2s 1.2s forwards;
}

/* EKRAN */
#cinema {
  position: relative;
  width: 100%;
  max-width: 900px;
  padding-bottom: 56.25%;
  background: #000;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,.8);
}

#screen {
  position: absolute;
  top: -100%;
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: screenDrop 2s 1.8s forwards;
}

#screen video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ================= ANIMACJE ================= */
@keyframes projectorIn {
  from { transform: translateY(-50px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes beamOn {
  to { opacity: 1; }
}

@keyframes screenDrop {
  to { top: 0; }
}

/* ================= SEKCJA ================= */
section {
  padding: 5rem 10%;
  max-width: 1000px;
  margin: auto;
}

h2 {
  font-family: 'Playfair Display', serif;
  text-align: center;
  margin-bottom: 2rem;
  color: #f5e6b8;
}
</style>
</head>

<body>

<header>
  <h1>Zamów projekt</h1>
  <p>Kliknij poniżej – sala gaśnie, projektor rusza 🎬</p>
  <button class="cta" id="startCinema">Uruchom kino</button>
</header>

<div id="cinema-wrapper">
  <div id="projector">PROJECTOR</div>
  <div id="beam"></div>

  <div id="cinema">
    <div id="screen">
      <video id="video" src="wideo.mp4" loop playsinline></video>
    </div>
  </div>
</div>

<section>
  <h2>Limitowane formy</h2>
  <p>Każdy projekt powstaje jako unikat – bez powtórzeń i kompromisów.</p>
</section>

<script>
document.getElementById("startCinema").addEventListener("click", () => {
  const video = document.getElementById("video");
  video.muted = false;
  video.play();
});
</script>

</body>
</html>
