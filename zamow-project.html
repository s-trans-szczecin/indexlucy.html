<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamów projekt | LucyEpoxyStudio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:#fff;
  overflow-x:hidden;
}

/* ===== ULTRA LUX PATTERN ===== */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    repeating-linear-gradient(
      45deg,
      rgba(212,175,55,.04) 0 2px,
      transparent 2px 40px
    );
  opacity:.35;
  z-index:-2;
  animation:luxMove 40s linear infinite;
}
@keyframes luxMove{
  to{background-position:400px 400px}
}

/* ===== CINEMA AREA ===== */
#cinema-wrapper{
  position:relative;
  padding:7rem 1rem 8rem;
  display:flex;
  justify-content:center;
}

/* ===== CURTAINS ===== */
.curtain{
  position:fixed;
  top:0;
  width:50%;
  height:100vh;
  background:linear-gradient(
    to right,
    #2b0000,
    #6b0000,
    #2b0000
  );
  z-index:20;
  box-shadow:inset -40px 0 60px rgba(0,0,0,.8);
}
#curtain-left{left:0;animation:curtainLeft 2.6s 2.6s forwards}
#curtain-right{
  right:0;
  transform:scaleX(-1);
  animation:curtainRight 2.6s 2.6s forwards
}
@keyframes curtainLeft{to{transform:translateX(-100%)}}
@keyframes curtainRight{to{transform:translateX(100%) scaleX(-1)}}

/* ===== PROJECTOR ===== */
#projector{
  position:absolute;
  top:-90px;
  width:200px;
  height:70px;
  background:linear-gradient(145deg,#1b1b1b,#000);
  border-radius:16px;
  display:flex;
  justify-content:center;
  align-items:center;
  letter-spacing:4px;
  color:#d4af37;
  opacity:0;
  animation:projectorIn 1.5s forwards;
  z-index:10;
}
#projector::after{
  content:"";
  position:absolute;
  right:16px;
  width:18px;
  height:18px;
  background:radial-gradient(circle,#fff 0%,#d4af37 45%,#000 70%);
  border-radius:50%;
}
@keyframes projectorIn{
  to{opacity:1;transform:translateY(60px)}
}

/* ===== LIGHT BEAM ===== */
#beam{
  position:absolute;
  top:-10px;
  width:0;
  height:0;
  border-left:300px solid transparent;
  border-right:300px solid transparent;
  border-bottom:700px solid rgba(212,175,55,.12);
  opacity:0;
  filter:blur(1px);
  animation:beamOn 1.5s 1.2s forwards;
  z-index:5;
}
@keyframes beamOn{to{opacity:1}}

/* ===== DUST ===== */
.dust{
  position:absolute;
  width:2px;
  height:2px;
  background:rgba(255,255,255,.4);
  animation:floatDust linear infinite;
}
@keyframes floatDust{
  from{transform:translateY(0)}
  to{transform:translateY(600px)}
}

/* ===== SCREEN ===== */
#cinema{
  position:relative;
  width:100%;
  max-width:900px;
  padding-bottom:56.25%;
  background:#000;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.9);
  z-index:3;
}
#screen{
  position:absolute;
  top:-100%;
  width:100%;
  height:100%;
  animation:screenDrop 2s 1.8s forwards;
}
@keyframes screenDrop{to{top:0}}

#screen video{
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>
</head>

<body>

<div id="curtain-left" class="curtain"></div>
<div id="curtain-right" class="curtain"></div>

<div id="cinema-wrapper">
  <div id="projector">PROJECTOR</div>
  <div id="beam" id="dust-area"></div>

  <div id="cinema">
    <div id="screen">
      <video id="video" src="wideo.mp4" autoplay loop playsinline></video>
    </div>
  </div>
</div>

<audio id="sound" src="projector.mp3"></audio>

<script>
/* DUST */
for(let i=0;i<60;i++){
  const d=document.createElement("div");
  d.className="dust";
  d.style.left=Math.random()*100+"%";
  d.style.top=Math.random()*-400+"px";
  d.style.animationDuration=5+Math.random()*8+"s";
  document.getElementById("beam").appendChild(d);
}

/* SOUND + VIDEO */
window.addEventListener("load",()=>{
  const video=document.getElementById("video");
  const sound=document.getElementById("sound");

  sound.play().catch(()=>{});
  video.muted=false;
  video.play().catch(()=>{
    document.body.addEventListener("click",()=>{
      video.muted=false;
      video.play();
      sound.play();
    },{once:true});
  });
});
</script>

</body>
</html>
