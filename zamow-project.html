<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamów projekt | LucyEpoxyStudio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:#f4f4f4;
  overflow-x:hidden;
}

/* LUX GRID */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    repeating-linear-gradient(90deg, rgba(212,175,55,.05) 0 2px, transparent 2px 30px),
    repeating-linear-gradient(0deg, rgba(212,175,55,.04) 0 2px, transparent 2px 30px);
}

/* HOME BUTTON */
.home-btn{
  position:fixed;
  top:20px;
  left:20px;
  z-index:999;
  padding:.6rem 1.4rem;
  border-radius:40px;
  font-size:.9rem;
  text-decoration:none;
  color:#f5e6b8;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(212,175,55,.6);
}
.home-btn:hover{
  background:rgba(212,175,55,.25);
}

/* HEADER */
header{
  min-height:60vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:4rem 2rem;
}
header h1{
  font-family:'Playfair Display',serif;
  font-size:3rem;
  color:#f5e6b8;
}
header p{
  max-width:760px;
  margin-top:1rem;
}

/* CINEMA */
section{
  padding:5rem 10%;
  max-width:1100px;
  margin:auto;
}
#cinema{
  position:relative;
  max-width:900px;
  margin:4rem auto;
  padding-bottom:56.25%;
  background:#000;
  border-radius:22px;
  overflow:hidden;
}

/* PROJECTOR */
#projector{
  position:absolute;
  top:-160px;
  left:50%;
  transform:translateX(-50%);
  width:180px;
  animation:drop 1s ease forwards;
  z-index:5;
}
@keyframes drop{
  to{top:-20px}
}
#projector img{
  width:100%;
  display:block;
  filter:drop-shadow(0 20px 40px rgba(212,175,55,.6));
}

/* SCREEN */
#screen{
  position:absolute;
  inset:0;
  transform:translateY(-100%);
  animation:screen 1.2s ease forwards;
  animation-delay:1s;
}
@keyframes screen{
  to{transform:translateY(0)}
}
#screen video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

/* TEXT */
.section-title{
  font-family:'Playfair Display',serif;
  font-size:2.3rem;
  text-align:center;
  margin:3rem 0 1rem;
  color:#f5e6b8;
}
p{text-align:center}

/* FOOTER */
footer{
  text-align:center;
  padding:3rem;
  color:#777;
}
</style>
</head>

<body>

<a class="home-btn" href="https://s-trans-szczecin.github.io/indexlucy.html/LucyEpoxyStudio.html">
⬅ Strona główna
</a>

<header>
  <h1>Zamów projekt</h1>
  <p>Unikatowe formy, rzemiosło i design klasy galerii sztuki.</p>
</header>

<section>

<h2 class="section-title">Zobacz naszą pracę</h2>

<div id="cinema">
  <div id="projector">
    <img src="projector.png" alt="Projektor">
  </div>

  <div id="screen">
    <video src="wideo.mp4" autoplay loop muted playsinline></video>
  </div>
</div>

<h2 class="section-title">Limitowane formy</h2>
<p>Każdy projekt powstaje jako unikat – bez kompromisów.</p>

</section>

<footer>
© LucyEpoxyStudio · Ultra-Lux Design
</footer>

</body>
</html>
