<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamów projekt | LucyEpoxyStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:#f4f4f4;
  overflow-x:hidden;
}

/* HEADER */
header{
  min-height:40vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
header h1{
  font-family:'Playfair Display',serif;
  font-size:3rem;
  color: #f5e6b8;
  background: linear-gradient(90deg, #f5e6b8, #d4af37);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 10px rgba(0,0,0,.4);
  letter-spacing: 1px;
}

/* SECTION */
section{
  max-width:1400px;
  margin:auto;
  padding:3rem 6%;
}

/* INFO */
.pre-info{
  text-align:center;
  font-size:1.15rem;
  margin-bottom:3rem;
  color:#f4e6b8;
}

/* CINEMA */
.cinema-row{
  position:relative;
  display:flex;
  align-items:center;
  gap:3rem;
}
#cinema{
  position:relative;
  flex:1;
  padding-bottom:56.25%;
  background:#000;
  border-radius:22px;
  overflow:hidden;
  box-shadow: 0 10px 40px rgba(212,175,55,.3);
}
#cinema video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:20px;
}

/* PLAY BUTTON */
#playBtn{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-family:'Playfair Display',serif;
  font-size:2.5rem;
  color:#d4af37;
  cursor:pointer;
  z-index:20;
  background:rgba(0,0,0,0.3);
  padding:1rem 1.5rem;
  border-radius:20px;
  animation:pulse 1.5s infinite;
  user-select:none;
}
#playBtn:hover{
  transform:translate(-50%,-50%) scale(1.05);
}
@keyframes pulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  50%{transform:translate(-50%,-50%) scale(1.1);opacity:.8;}
}

/* BACK BUTTON */
.back-btn{
  display:inline-block;
  padding:1rem 2rem;
  background:linear-gradient(90deg,#f5e6b8,#d4af37);
  color:#050505;
  font-family:'Playfair Display',serif;
  font-size:1.15rem;
  text-decoration:none;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(212,175,55,.4);
  transition:all .3s ease;
  margin:3rem auto;
}
.back-btn:hover{
  transform:scale(1.05);
  box-shadow:0 12px 30px rgba(212,175,55,.5);
}

/* MOBILE */
@media(max-width:900px){
  .cinema-row{flex-direction:column}
}
footer{
  text-align:center;
  padding:3rem;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>Zamów projekt</h1>
</header>

<section>
<p class="pre-info">
To nie jest wizualizacja — to realna projekcja fragmentu naszej realizacji.
</p>

<div class="cinema-row">
  <div id="cinema">
    <video id="film" loop playsinline></video>
    <div id="playBtn">▶</div>
  </div>
</div>
</section>

<!-- BACK BUTTON -->
<div style="text-align:center;">
  <a href="https://s-trans-szczecin.github.io/indexlucy.html/LucyEpoxyStudio.html" class="back-btn">
    Powrót do strony startowej
  </a>
</div>

<footer>
© LucyEpoxyStudio · Ultra-Lux Design
</footer>

<script>
const video = document.getElementById('film');
const playBtn = document.getElementById('playBtn');

// ustaw źródło wideo
video.src = "wideo.mp4";
video.load();

playBtn.addEventListener('click',()=>{
  video.muted = false;
  video.volume = 1;
  video.play().catch(()=>{console.log("Nie udało się odtworzyć");});
  playBtn.style.display='none';
});
</script>

</body>
</html>
