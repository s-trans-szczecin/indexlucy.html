<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamów projekt | LucyEpoxyStudio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:#f4f4f4;
  overflow-x:hidden;
}

/* GRID */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    repeating-linear-gradient(90deg, rgba(212,175,55,.05) 0 2px, transparent 2px 30px),
    repeating-linear-gradient(0deg, rgba(212,175,55,.04) 0 2px, transparent 2px 30px);
}

/* HOME */
.home-btn{
  position:fixed;
  top:20px;
  left:20px;
  z-index:999;
  padding:.6rem 1.4rem;
  border-radius:40px;
  font-size:.9rem;
  text-decoration:none;
  color:#f5e6b8;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(212,175,55,.6);
}

/* HEADER */
header{
  min-height:55vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
header h1{
  font-family:'Playfair Display',serif;
  font-size:3rem;
  color:#f5e6b8;
}

/* SECTION */
section{
  padding:4rem 8%;
  max-width:1400px;
  margin:auto;
}

/* INFO */
.pre-info{
  text-align:center;
  font-size:1.15rem;
  margin-bottom:2.5rem;
}

/* CINEMA ROW */
.cinema-row{
  display:grid;
  grid-template-columns: 1fr 220px;
  gap:3rem;
  align-items:center;
}

/* SCREEN */
#cinema{
  position:relative;
  padding-bottom:56.25%;
  background:#000;
  border-radius:22px;
  overflow:hidden;
}
#cinema video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}

/* PROJECTOR */
.projector-wrap{
  position:relative;
  width:220px;
}
.projector-wrap img{
  width:100%;
  filter:drop-shadow(0 20px 40px rgba(212,175,55,.6));
}

/* GOLD BEAM */
.beam{
  position:absolute;
  right:100%;
  top:50%;
  width:420px;
  height:180px;
  transform:translateY(-50%);
  background:linear-gradient(90deg,
    rgba(212,175,55,.5),
    rgba(212,175,55,.15),
    rgba(212,175,55,0)
  );
  filter:blur(14px);
  animation:beam 2.2s ease-in-out infinite;
}
@keyframes beam{
  0%,100%{opacity:.6}
  50%{opacity:1}
}

/* FOOTER */
footer{
  text-align:center;
  padding:3rem;
  color:#777;
}

/* MOBILE */
@media(max-width:900px){
  .cinema-row{
    grid-template-columns:1fr;
  }
  .beam{display:none}
}
</style>
</head>

<body>

<a class="home-btn" href="https://s-trans-szczecin.github.io/indexlucy.html/LucyEpoxyStudio.html">
⬅ Strona główna
</a>

<header>
  <h1>Zamów projekt</h1>
</header>

<section>

<p class="pre-info">
Poniżej prezentujemy rzeczywisty fragment realizacji — dokładnie tak, jak widzi go klient.
</p>

<div class="cinema-row">

  <div id="cinema">
    <video
      id="film"
      src="wideo.mp4"
      autoplay
      muted
      loop
      playsinline
      preload="auto">
    </video>
  </div>

  <div class="projector-wrap">
    <div class="beam"></div>
    <img src="projektor.png" alt="Projektor">
  </div>

</div>

</section>

<footer>
© LucyEpoxyStudio · Ultra-Lux Design
</footer>

<script>
const v = document.getElementById('film');

v.addEventListener('loadeddata', () => {
  try {
    v.currentTime = 0.01; // omija czarną klatkę
    v.volume = 1;
    v.muted = false;
    v.play();
  } catch(e){}
});

// awaryjne wymuszenie
setTimeout(()=>v.play().catch(()=>{}),200);
setTimeout(()=>v.play().catch(()=>{}),600);

// klik jako fallback (Safari / iOS)
document.addEventListener('click',()=>{
  v.muted=false;
  v.play().catch(()=>{});
},{once:true});
</script>

</body>
</html>
