<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamów projekt | LucyEpoxyStudio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:#f4f4f4;
  overflow-x:hidden;
}

/* HEADER */
header{
  min-height:40vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
header h1{
  font-family:'Playfair Display',serif;
  font-size:3rem;
  color: #f5e6b8;
  background: linear-gradient(90deg, #f5e6b8, #d4af37);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 10px rgba(0,0,0,.4);
  letter-spacing: 1px;
}

/* SECTION */
section{
  max-width:1400px;
  margin:auto;
  padding:3rem 6%;
}

/* INFO */
.pre-info{
  text-align:center;
  font-size:1.15rem;
  margin-bottom:3rem;
  color:#f4e6b8;
}

/* CINEMA */
.cinema-row{
  display:flex;
  align-items:center;
  gap:3rem;
  position:relative;
}
#cinema{
  position:relative;
  flex:1;
  padding-bottom:56.25%;
  background:#000;
  border-radius:22px;
  overflow:hidden;
  box-shadow: 0 10px 40px rgba(212,175,55,.3);
}
#cinema video{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:20px;
  display:block;
}

/* GOLD PLAY BUTTON */
#playBtn{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:linear-gradient(90deg,#f5e6b8,#d4af37);
  border:none;
  border-radius:50%;
  width:80px;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:20;
  box-shadow:0 8px 30px rgba(212,175,55,.5);
  animation:pulse 1.2s infinite;
}
#playBtn::after{
  content:"▶";
  font-size:2rem;
  color:#050505;
  margin-left:3px;
}
@keyframes pulse{
  0%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.15)}
  100%{transform:translate(-50%,-50%) scale(1)}
}

/* MOBILE */
@media(max-width:900px){
  .cinema-row{flex-direction:column}
}
footer{
  text-align:center;
  padding:3rem;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>Zamów projekt</h1>
</header>

<section>

<p class="pre-info">
To nie jest wizualizacja — to realna projekcja fragmentu naszej realizacji.
</p>

<div class="cinema-row">

  <div id="cinema">
    <!-- Wideo jest zawsze wyciszone na starcie, żeby mobilne przeglądarki pozwoliły wyświetlić obraz -->
    <video id="film" src="wideo.mp4" playsinline webkit-playsinline muted></video>
    <button id="playBtn"></button>
  </div>

</div>

</section>

<footer>
© LucyEpoxyStudio · Ultra-Lux Design
</footer>

<script>
const video = document.getElementById('film');
const playBtn = document.getElementById('playBtn');

/* PLAY BUTTON */
playBtn.addEventListener('click', ()=>{
  // Odblokowanie dźwięku i start
  video.muted = false;
  video.volume = 0.7;
  video.play();
  playBtn.style.display = 'none';
});
</script>

</body>
</html>
