<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Ultra-Lux Design</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:#f4f4f4;
  line-height:1.7;
  overflow-x:hidden;
}

/* ================= INTRO ================= */
#intro{
  position:fixed;inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  animation:introFade 4.5s forwards;
}
.logo3d{
  font-family:'Playfair Display',serif;
  font-size:clamp(2.5rem,6vw,4rem);
  padding:.6em .9em;
  color:#d4af37;
  text-shadow:0 10px 30px rgba(212,175,55,.7);
}
.logo3d span{
  background:linear-gradient(120deg,#fff2b2,#d4af37,#b08d2f);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
@keyframes introFade{0%,80%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(max-width:480px){.logo3d{font-size:2.2rem}}

/* ================= MARBLE PILLARS ================= */
.pillars{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
}
.pillar{
  position:absolute;
  top:0;
  width:260px;
  height:100vh;
  opacity:.18;
  background:
    linear-gradient(120deg,
      #ffffff,
      #eaeaea,
      #f7f7f7,
      #dcdcdc,
      #ffffff);
  background-size:400% 400%;
  filter:blur(0.5px);
  animation:marbleMove 16s ease-in-out infinite,
            pillarRotate 40s linear infinite;
}
.pillar.left{left:-130px}
.pillar.right{right:-130px;animation-direction:reverse}
@keyframes marbleMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes pillarRotate{
  from{transform:rotateY(0deg)}
  to{transform:rotateY(360deg)}
}
@media(max-width:768px){.pillars{display:none}}

/* ================= HERO ================= */
header{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:2rem;
  position:relative;
}
header::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top,
    rgba(255,255,255,.1),
    rgba(212,175,55,.25),
    rgba(0,0,0,.6));
  z-index:-2;
}
header h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(3rem,6vw,4.5rem);
}
header h1 span{
  background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
header p{
  max-width:760px;
  margin-top:1.8rem;
  font-size:1.25rem;
  color:#e0e0e0;
}
.cta{
  margin-top:3rem;
  padding:1rem 2.8rem;
  border-radius:50px;
  border:1px solid rgba(212,175,55,.6);
  background:rgba(255,255,255,.06);
  color:#f5e6b8;
  cursor:pointer;
}

/* ================= SECTIONS ================= */
section{padding:7rem 10%}
.section-title{
  font-family:'Playfair Display',serif;
  font-size:2.8rem;
  margin-bottom:3rem;
  text-align:center;
  color:#f5e6b8;
}

/* ================= GALLERY ================= */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:2rem;
}
.gallery-item{
  height:320px;
  border-radius:28px;
  background-size:cover;
  background-position:center;
  box-shadow:0 30px 60px rgba(0,0,0,.6);
  transition:.6s;
}
.gallery-item:hover{
  transform:scale(1.05);
  box-shadow:0 50px 100px rgba(212,175,55,.45);
}

/* ================= FOOTER ================= */
footer{
  text-align:center;
  padding:3rem 1rem;
  color:#777;
  font-size:.9rem;
}
</style>
</head>

<body>

<div id="intro">
  <div class="logo3d">Lucy<span>Epoxy</span>Studio</div>
</div>

<div class="pillars">
  <div class="pillar left"></div>
  <div class="pillar right"></div>
</div>

<header>
  <h1><span>Lucy</span>EpoxyStudio</h1>
  <p>Ultra-lux meble i formy z żywicy epoksydowej.</p>
  <button class="cta">Zamów projekt premium</button>
</header>

<section>
  <h2 class="section-title">Wybrane realizacje</h2>
  <div class="gallery">
    <div class="gallery-item" style="background-image:url('projekt1.jpg')"></div>
    <div class="gallery-item" style="background-image:url('projekt2.jpg')"></div>
    <div class="gallery-item" style="background-image:url('projekt3.jpg')"></div>
    <div class="gallery-item" style="background-image:url('projekt4.jpg')"></div>
  </div>
</section>

<footer>
© LucyEpoxyStudio · Ultra-Lux Design
</footer>

</body>
</html>
