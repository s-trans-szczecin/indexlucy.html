<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LucyEpoxyStudio | Ultra-Lux Design</title>
<meta name="description" content="LucyEpoxyStudio - premium meble i formy z żywicy epoksydowej.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#050505;color:#f4f4f4;line-height:1.7;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(90deg, rgba(212,175,55,.06) 0 2px, transparent 2px 30px),repeating-linear-gradient(0deg, rgba(212,175,55,.04) 0 2px, transparent 2px 30px);opacity:.25}
header{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem;position:relative}
header::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top, rgba(255,255,255,.1), rgba(212,175,55,.25), rgba(0,0,0,.7));z-index:-1}
h1{font-family:'Playfair Display',serif;font-size:clamp(3rem,6vw,4.5rem)}
h1 span{background:linear-gradient(120deg,#d4af37,#fff2b2,#b08d2f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-text{max-width:760px;margin-top:1.2rem;font-size:1.2rem;color:#e0e0e0}
.nav-buttons{margin-top:2rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem}
.cta{display:inline-block;padding:1rem 1.7rem;border-radius:50px;border:1px solid rgba(212,175,55,.6);background:rgba(255,255,255,.06);color:#f5e6b8;text-decoration:none;transition:.4s}
.cta:hover{background:rgba(212,175,55,.25);transform:translateY(-4px);box-shadow:0 25px 50px rgba(212,175,55,.4)}
section{padding:7rem 10%}
.section-title{font-family:'Playfair Display',serif;font-size:2.8rem;margin-bottom:3rem;text-align:center;color:#f5e6b8}
.values-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2rem}
.card{background:rgba(255,255,255,.05);padding:2rem;border-radius:22px;box-shadow:0 24px 50px rgba(0,0,0,.5)}
.card h3{color:#f5e6b8;margin-bottom:.6rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem}
.gallery-item{height:300px;border-radius:24px;background-size:cover;background-position:center;box-shadow:0 25px 45px rgba(0,0,0,.6)}
footer{text-align:center;padding:3rem 1rem;color:#777;font-size:.9rem}
@media(max-width:480px){h1{font-size:clamp(2rem,8vw,3rem)}}
</style>
</head>
<body>
<header>
  <h1><span>Lucy</span>EpoxyStudio</h1>
  <p class="hero-text" data-i18n="hero_desc"></p>
  <div class="nav-buttons">
    <a class="cta" href="/de/index.html" data-i18n="btn_de"></a>
    <a class="cta" href="/en/index.html" data-i18n="btn_en"></a>
    <a class="cta" href="zamow-project.html" data-i18n="btn_order"></a>
    <a class="cta" href="contact.html" data-i18n="btn_contact"></a>
    <a class="cta" href="android-download.html" data-i18n="btn_android"></a>
  </div>
</header>

<section>
  <h2 class="section-title" data-i18n="why_title"></h2>
  <div class="values-grid">
    <article class="card">
      <h3 data-i18n="card1_title"></h3>
      <p data-i18n="card1_text"></p>
    </article>
    <article class="card">
      <h3 data-i18n="card2_title"></h3>
      <p data-i18n="card2_text"></p>
    </article>
    <article class="card">
      <h3 data-i18n="card3_title"></h3>
      <p data-i18n="card3_text"></p>
    </article>
  </div>
</section>

<section>

  <div class="gallery">
    <div class="gallery-item" style="background-image:url('projekt1.jpg')"></div>
    <div class="gallery-item" style="background-image:url('projekt2.jpg')"></div>
    <div class="gallery-item" style="background-image:url('projekt3.jpg')"></div>
    <div class="gallery-item" style="background-image:url('projekt4.jpg')"></div>
    <div class="gallery-item" style="background-image:url('foto1.jpg')"></div>
    <div class="gallery-item" style="background-image:url('foto2.jpg')"></div>
  </div>
</section>

<footer data-i18n="footer_text"></footer>
