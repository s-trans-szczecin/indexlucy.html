<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt | LucyEpoxyStudio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:#f4f4f4;
  line-height:1.7;
  overflow-x:hidden;
  position:relative;
}

/* ================= ANIMOWANY WZÓR GRECKI TŁA ================= */
body::before {
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;

  background-image: url('grecki-wzor.png'); /* Twój przezroczysty złoty wzór */
  background-repeat:repeat;
  background-size:200px;
  opacity:0.08;

  animation: movePattern 25s linear infinite alternate;
  filter: hue-rotate(0deg);
}

/* ================= LIGHT SWEEP ================= */
body::after {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  background: linear-gradient(120deg, rgba(212,175,55,0) 0%, rgba(212,175,55,0.08) 50%, rgba(212,175,55,0) 100%);
  transform: translateX(-100%);
  animation: lightSweep 12s linear infinite;
}

@keyframes lightSweep{
  0% { transform: translateX(-100%) skewX(-25deg); }
  100% { transform: translateX(200%) skewX(-25deg); }
}

@keyframes movePattern {
  0% { background-position:0 0; filter: hue-rotate(0deg); }
  25% { background-position:50px 100px; filter: hue-rotate(15deg); }
  50% { background-position:100px 50px; filter: hue-rotate(30deg); }
  75% { background-position:50px 0px; filter: hue-rotate(15deg); }
  100% { background-position:0 0; filter: hue-rotate(0deg); }
}

/* Header */
header{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:4rem 2rem;
  position:relative;
}
header h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(2.5rem,6vw,3.5rem);
  color:#f5e6b8;
}
header p{
  max-width:760px;
  margin-top:1.2rem;
  font-size:1.1rem;
  color:#e0e0e0;
}

/* CTA */
.cta{
  padding:1rem 2rem;
  border-radius:50px;
  border:1px solid rgba(212,175,55,.6);
  background:rgba(255,255,255,.06);
  color:#f5e6b8;
  cursor:pointer;
  font-size:1rem;
  transition:.4s;
}
.cta:hover{
  background:rgba(212,175,55,.25);
  transform:translateY(-4px);
  box-shadow:0 25px 50px rgba(212,175,55,.4);
}

/* Formularz */
.contact-form{
  max-width:700px;
  margin:3rem auto;
  display:flex;
  flex-direction:column;
  gap:1.5rem;
}
.contact-form input,
.contact-form textarea{
  padding:1rem;
  border-radius:12px;
  border:none;
  background:rgba(255,255,255,.06);
  color:#f4f4f4;
  font-size:1rem;
  backdrop-filter:blur(10px);
}
.contact-form input::placeholder,
.contact-form textarea::placeholder{
  color:#d4af37;
  opacity:.7;
}
.contact-form textarea{
  min-height:150px;
  resize:none;
}
.contact-form button{
  padding:1rem 2rem;
  border-radius:50px;
  border:1px solid rgba(212,175,55,.6);
  background:rgba(255,255,255,.06);
  color:#f5e6b8;
  cursor:pointer;
  font-size:1rem;
  transition:.4s;
}
.contact-form button:hover{
  background:rgba(212,175,55,.25);
  transform:translateY(-4px);
  box-shadow:0 25px 50px rgba(212,175,55,.4);
}

/* Stopka */
footer{
  text-align:center;
  padding:3rem 1rem;
  color:#777;
  font-size:.9rem;
}
</style>
</head>

<body>

<header style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4rem 2rem; position:relative;">
  <h1>Kontakt</h1>
  <p>Masz pytania lub chcesz zamówić projekt? Skontaktuj się z nami przez formularz lub pobierz aplikację.</p>

  <!-- Kontener na przyciski -->
  <div style="margin-top:2rem; display:flex; gap:1rem; flex-wrap:wrap; justify-content:center;">
    <button class="cta" onclick="window.location.href='index.html'">Strona główna</button>
    <button class="cta" onclick="window.location.href='android-download.html'">Pobierz na Androida</button>
  </div>
</header>

<section>
  <form class="contact-form" action="#" method="POST">
    <input type="text" name="name" placeholder="Twoje imię i nazwisko" required>
    <input type="email" name="email" placeholder="Twój email" required>
    <input type="text" name="subject" placeholder="Temat" required>
    <textarea name="message" placeholder="Twoja wiadomość..." required></textarea>
    <button type="submit">Wyślij wiadomość</button>
  </form>
</section>

<footer>
© LucyEpoxyStudio · Ultra-Lux Design · Ręcznie · Unikatowo
</footer>

</body>
</html>
